name: chariot-media-prod

services:
  chariot-minio:
    image: minio/minio:latest
    container_name: chariot-minio-prod
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - chariot_minio_data_prod:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - media-network
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chariot-minio-prod.rule=Host(`${MINIO_HOST}`)"
      - "traefik.http.routers.chariot-minio-prod.entrypoints=websecure"
      - "traefik.http.routers.chariot-minio-prod.tls.certresolver=letsencrypt"
      - "traefik.http.services.chariot-minio-prod.loadbalancer.server.port=9000"
      - "traefik.http.routers.chariot-minio-prod.service=chariot-minio-prod"
      - "traefik.docker.network=traefik-public"

  chariot-media:
    ports:
      - "9005:9005"
    image: ghcr.io/chariot-group/chariot-media-production:latest
    container_name: chariot-media-prod
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: production
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      METRICS_BASIC_AUTH_USER: ${METRICS_BASIC_AUTH_USER:-}
      METRICS_BASIC_AUTH_PASSWORD: ${METRICS_BASIC_AUTH_PASSWORD:-}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-}
      LOKI_ENABLED: ${LOKI_ENABLED:-false}
      LOKI_URL: ${LOKI_URL:-}
      LOKI_LOG_LEVEL: ${LOKI_LOG_LEVEL:-info}
      ADVENTURE_INTERNAL_URL: ${ADVENTURE_INTERNAL_URL}
      CHARIOT_SESSION_API_URL: ${CHARIOT_SESSION_API_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://chariot-minio-prod:9000}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-chariot-media}
      MEDIA_PRESIGNED_TTL_SECONDS: ${MEDIA_PRESIGNED_TTL_SECONDS:-1800}
    depends_on:
      chariot-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9005/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - media-network
      - chariot-group-network-prod
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  chariot_minio_data_prod:

networks:
  media-network:
    driver: bridge
  chariot-group-network-prod:
    external: true
  traefik-public:
    external: true
