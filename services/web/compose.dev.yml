services:

  chariot-web:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: chariot-web
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./client:/app
      - web_node_modules:/app/node_modules
      - next_cache:/app/.next
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NODE_OPTIONS: "--max-old-space-size=4096"
      NEXT_PUBLIC_ENV_NAME: development
      NEXT_PUBLIC_API_URL: ${GATEWAY_URL:-http://localhost:8082}
      NEXT_PUBLIC_SESSION_WS_URL: ${SESSION_WS_URL:-http://localhost:9002}
      NEXT_PUBLIC_CODEX_URL: ${CODEX_URL:-http://localhost:9001}
      NEXT_PUBLIC_KEYCLOAK_URL: ${KEYCLOAK_URL}
      NEXT_PUBLIC_KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      # File watching optimizations (no polling needed on modern Docker Desktop)
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      WATCHPACK_POLLING: "false"
      CHOKIDAR_USEPOLLING: "false"
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-local}
      LOKI_ENABLED: ${LOKI_ENABLED:-false}
      LOKI_URL: ${LOKI_URL:-}
      LOKI_LOG_LEVEL: ${LOKI_LOG_LEVEL:-info}
    shm_size: 1gb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - chariot-group-network
    command: ["npm", "run", "dev:docker"]
  
volumes:
  next_cache:
  web_node_modules:

networks:
  chariot-group-network:
    external: true