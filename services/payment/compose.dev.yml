services:
  chariot-payment-postgres:
    image: postgres:16-alpine
    container_name: chariot-payment-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    volumes:
      - chariot_payment_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${PAYMENT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PAYMENT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PAYMENT_POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENT_POSTGRES_USER} -d ${PAYMENT_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - payment-network

  chariot-payment:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: chariot-payment
    restart: unless-stopped
    working_dir: /app
    ports:
      - "9003:9003"
    volumes:
      - ./api:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      DATABASE_URL: ${PAYMENT_DATABASE_URL}
      PAYMENT_URL: ${PAYMENT_URL:-http://localhost:9003}
      PAYMENT_VERSION: ${PAYMENT_VERSION:-dev}
      FRONTEND_URL: ${FRONTEND_URL}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-chariot-app}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
    depends_on:
      chariot-payment-postgres:
        condition: service_healthy
    networks:
      - payment-network
      - chariot-group-network
    extra_hosts:
      - "localhost:host-gateway"

  chariot-payment-admin:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: chariot-payment-admin
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3001:3001"
    volumes:
      - ./client:/app
      - payment_admin_node_modules:/app/node_modules
      - payment_admin_next_cache:/app/.next
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_PAYMENT_API_URL: ${GATEWAY_URL:-http://localhost:8082}/payment
      NEXT_PUBLIC_KEYCLOAK_URL: ${KEYCLOAK_URL}
      NEXT_PUBLIC_KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-chariot-app}
    networks:
      - payment-network
      - chariot-group-network
    command: ["npm", "run", "dev"]

volumes:
  chariot_payment_postgres_data:
  chariot_payment_logs:
  payment_admin_node_modules:
  payment_admin_next_cache:

networks:
  payment-network:
    driver: bridge
  chariot-group-network:
    external: true
