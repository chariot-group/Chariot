name: chariot-gateway-prod

services:
  chariot-gateway:
    image: ghcr.io/chariot-group/chariot-gateway-production:latest
    container_name: chariot-gateway-prod
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8082:8082"
    environment:
      NODE_ENV: production
      GATEWAY_PORT: ${GATEWAY_PORT:-8082}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-warn}
      GATEWAY_RATE_LIMIT_MAX: ${GATEWAY_RATE_LIMIT_MAX:-500}
      GATEWAY_RATE_LIMIT_WINDOW: ${GATEWAY_RATE_LIMIT_WINDOW:-60000}
      # Backend services - add more as needed with pattern {SERVICE_NAME}_SERVICE_URL
      ADVENTURE_SERVICE_URL: ${ADVENTURE_SERVICE_URL}
      SESSION_SERVICE_URL: ${SESSION_SERVICE_URL}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
    networks:
      - chariot-group-network-prod
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chariot-gateway-prod.rule=Host(`${GATEWAY_HOST}`)"
      - "traefik.http.routers.chariot-gateway-prod.entrypoints=websecure"
      - "traefik.http.routers.chariot-gateway-prod.tls.certresolver=letsencrypt"
      - "traefik.http.services.chariot-gateway-prod.loadbalancer.server.port=8082"
      - "traefik.http.routers.chariot-gateway-prod.service=chariot-gateway-prod"
      - "traefik.docker.network=traefik-public"
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  chariot-group-network-prod:
    external: true
  traefik-public:
    external: true
