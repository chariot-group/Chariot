services:
  chariot-gateway:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    container_name: chariot-gateway-prod
    platform: linux/amd64
    restart: always
    ports:
      - "8082:8082"
    environment:
      NODE_ENV: production
      GATEWAY_PORT: ${GATEWAY_PORT:-8082}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-warn}
      GATEWAY_RATE_LIMIT_MAX: ${GATEWAY_RATE_LIMIT_MAX:-500}
      GATEWAY_RATE_LIMIT_WINDOW: ${GATEWAY_RATE_LIMIT_WINDOW:-60000}
      # Backend services - add more as needed with pattern {SERVICE_NAME}_SERVICE_URL
      ADVENTURE_SERVICE_URL: ${ADVENTURE_SERVICE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
    networks:
      - chariot-group-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  chariot-group-network:
    external: true
