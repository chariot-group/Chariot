services:
  chariot-gateway:
    image: ghcr.io/chariot-group/chariot-gateway-integration:latest
    container_name: chariot-gateway-integ
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8082:8082"
    environment:
      NODE_ENV: integration
      GATEWAY_PORT: ${GATEWAY_PORT:-8082}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-info}
      GATEWAY_RATE_LIMIT_MAX: ${GATEWAY_RATE_LIMIT_MAX:-200}
      GATEWAY_RATE_LIMIT_WINDOW: ${GATEWAY_RATE_LIMIT_WINDOW:-60000}
      # Backend services - add more as needed with pattern {SERVICE_NAME}_SERVICE_URL
      ADVENTURE_SERVICE_URL: ${ADVENTURE_SERVICE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
    networks:
      - chariot-group-network-integ
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chariot-gateway-integ.rule=Host(`${GATEWAY_HOST}`)"
      - "traefik.http.routers.chariot-gateway-integ.entrypoints=websecure"
      - "traefik.http.routers.chariot-gateway-integ.tls.certresolver=letsencrypt"
      - "traefik.http.services.chariot-gateway-integ.loadbalancer.server.port=8082"
      - "traefik.http.routers.chariot-gateway-integ.service=chariot-gateway-integ"
      - "traefik.docker.network=traefik-public"
      # CORS middleware configuration
      - "traefik.http.middlewares.cors-gateway-integ.headers.accessControlAllowOriginList=${FRONTEND_URL}"
      - "traefik.http.middlewares.cors-gateway-integ.headers.accessControlAllowMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS"
      - "traefik.http.middlewares.cors-gateway-integ.headers.accessControlAllowHeaders=Content-Type,Authorization,Accept"
      - "traefik.http.middlewares.cors-gateway-integ.headers.accessControlAllowCredentials=true"
      - "traefik.http.middlewares.cors-gateway-integ.headers.accessControlMaxAge=3600"
      - "traefik.http.middlewares.cors-gateway-integ.headers.accessControlExposeHeaders=Authorization"
      - "traefik.http.middlewares.cors-gateway-integ.headers.addVaryHeader=true"
      # Apply CORS middleware to router
      - "traefik.http.routers.chariot-gateway-integ.middlewares=cors-gateway-integ"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  chariot-group-network-integ:
    external: true
  traefik-public:
    external: true
