name: chariot-gateway-integ

services:
  chariot-gateway:
    image: ghcr.io/chariot-group/chariot-gateway-integration:latest
    container_name: chariot-gateway-integ
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: integration
      GATEWAY_PORT: ${GATEWAY_PORT:-8082}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-info}
      # Backend services - add more as needed with pattern {SERVICE_NAME}_SERVICE_URL
      ADVENTURE_SERVICE_URL: ${ADVENTURE_SERVICE_URL}
      SESSION_SERVICE_URL: ${SESSION_SERVICE_URL}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}
      MEDIA_SERVICE_URL: ${MEDIA_SERVICE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      METRICS_BASIC_AUTH_USER: ${METRICS_BASIC_AUTH_USER:-}
      METRICS_BASIC_AUTH_PASSWORD: ${METRICS_BASIC_AUTH_PASSWORD:-}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-integ}
      LOKI_ENABLED: ${LOKI_ENABLED:-false}
      LOKI_URL: ${LOKI_URL:-}
      LOKI_LOG_LEVEL: ${LOKI_LOG_LEVEL:-info}
    networks:
      - chariot-group-network-integ
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chariot-gateway-integ.rule=Host(`${GATEWAY_HOST}`)"
      - "traefik.http.routers.chariot-gateway-integ.entrypoints=websecure"
      - "traefik.http.routers.chariot-gateway-integ.tls.certresolver=letsencrypt"
      - "traefik.http.services.chariot-gateway-integ.loadbalancer.server.port=8082"
      - "traefik.http.routers.chariot-gateway-integ.service=chariot-gateway-integ"
      # Same-origin API for the web client: https://${FRONTEND_HOST}/gateway/* → gateway (prefix stripped).
      # No CORS preflight and no extra TLS connection on slow networks. Cookies are dropped both ways:
      # the API authenticates with the bearer token only. @see FR-web-first-load-performance (req. 18)
      - "traefik.http.routers.chariot-gateway-integ-app.rule=Host(`${FRONTEND_HOST}`) && PathPrefix(`/gateway/`)"
      - "traefik.http.routers.chariot-gateway-integ-app.priority=1000"
      - "traefik.http.routers.chariot-gateway-integ-app.entrypoints=websecure"
      - "traefik.http.routers.chariot-gateway-integ-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.chariot-gateway-integ-app.service=chariot-gateway-integ"
      - "traefik.http.routers.chariot-gateway-integ-app.middlewares=chariot-gateway-integ-app-strip,chariot-gateway-integ-app-no-cookies"
      - "traefik.http.middlewares.chariot-gateway-integ-app-strip.stripprefix.prefixes=/gateway"
      - "traefik.http.middlewares.chariot-gateway-integ-app-no-cookies.headers.customrequestheaders.Cookie="
      - "traefik.http.middlewares.chariot-gateway-integ-app-no-cookies.headers.customresponseheaders.Set-Cookie="
      - "traefik.docker.network=traefik-public"
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  chariot-group-network-integ:
    external: true
  traefik-public:
    external: true
