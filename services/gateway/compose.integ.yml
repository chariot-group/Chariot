services:
  chariot-gateway:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    container_name: chariot-gateway-integ
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      NODE_ENV: integration
      GATEWAY_PORT: ${GATEWAY_PORT:-8082}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-info}
      GATEWAY_RATE_LIMIT_MAX: ${GATEWAY_RATE_LIMIT_MAX:-200}
      GATEWAY_RATE_LIMIT_WINDOW: ${GATEWAY_RATE_LIMIT_WINDOW:-60000}
      ADVENTURE_SERVICE_URL: ${ADVENTURE_SERVICE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
    networks:
      - chariot-group-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  chariot-group-network:
    external: true
