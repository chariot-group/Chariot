services:
  chariot-admin:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: chariot-admin
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3001:3001"
    volumes:
      - ./client:/app
      - admin_node_modules:/app/node_modules
      - admin_next_cache:/app/.next
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_PAYMENT_API_URL: ${GATEWAY_URL:-http://localhost:8082}/payment
      NEXT_PUBLIC_KEYCLOAK_URL: ${KEYCLOAK_URL}
      NEXT_PUBLIC_KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-chariot-app}
    networks:
      - chariot-group-network
    command: ["npm", "run", "dev"]

volumes:
  admin_node_modules:
  admin_next_cache:

networks:
  chariot-group-network:
    external: true
