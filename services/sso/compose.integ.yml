name: chariot-sso-integ

services:
  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db-integ
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_db_data_integ:/var/lib/postgresql/data
    networks:
      - sso-network-integ
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  keycloak:
    build:
      context: .
      dockerfile_inline: |
        FROM quay.io/keycloak/keycloak:26.4
        RUN /opt/keycloak/bin/kc.sh build --db=postgres --health-enabled=true --metrics-enabled=true
    restart: unless-stopped
    container_name: keycloak-integ
    command:
      - start
      - --optimized
      - --import-realm
    ports:
      - "8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # Database
      KC_DB_URL: ${KEYCLOAK_DB_URL}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Hostname
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY: edge
      KC_LOG_LEVEL: info
    volumes:
      - ./keycloak/realm-export.integ.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - sso-network-integ
      - traefik-public
      - chariot-group-network-integ
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak-integ.rule=Host(`${KEYCLOAK_HOSTNAME}`)"
      - "traefik.http.routers.keycloak-integ.entrypoints=websecure"
      - "traefik.http.routers.keycloak-integ.tls.certresolver=letsencrypt"
      - "traefik.http.services.keycloak-integ.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.middlewares.keycloak-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.keycloak-headers.headers.customrequestheaders.X-Forwarded-Port=443"
      - "traefik.http.routers.keycloak-integ.middlewares=keycloak-headers"
    healthcheck:
      test: ["CMD-SHELL", "/opt/keycloak/bin/kcadm.sh config credentials --server http://localhost:8080 --realm master --user $${KEYCLOAK_ADMIN} --password $${KEYCLOAK_ADMIN_PASSWORD} 2>&1 | grep -q 'Logging into'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  keycloak-config:
    image: quay.io/keycloak/keycloak:26.4
    container_name: keycloak-config-integ
    restart: "no"
    environment:
      KEYCLOAK_SMTP_HOST: ${SMTP_HOST}
      KEYCLOAK_SMTP_PORT: ${SMTP_PORT}
      KEYCLOAK_SMTP_USER: ${SMTP_USER}
      KEYCLOAK_SMTP_PASSWORD: ${SMTP_PASSWORD}
      KEYCLOAK_SMTP_FROM: ${KEYCLOAK_SMTP_FROM}
      KEYCLOAK_SMTP_FROM_DISPLAY_NAME: ${KEYCLOAK_SMTP_FROM_DISPLAY_NAME}
      KEYCLOAK_SMTP_REPLY_TO: ${KEYCLOAK_SMTP_REPLY_TO}
      KEYCLOAK_SMTP_REPLY_TO_DISPLAY_NAME: ${KEYCLOAK_SMTP_REPLY_TO_DISPLAY_NAME}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_EMAIL: ${KEYCLOAK_ADMIN_EMAIL}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_ADMIN_FIRSTNAME: ${KEYCLOAK_ADMIN_FIRSTNAME}
      KEYCLOAK_ADMIN_LASTNAME: ${KEYCLOAK_ADMIN_LASTNAME}
    volumes:
      - ./keycloak-config.sh:/keycloak-config.sh:ro
    networks:
      - sso-network-integ
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["/bin/sh"]
    command: ["/keycloak-config.sh", "integ"]

volumes:
  keycloak_db_data_integ:

networks:
  sso-network-integ:
    driver: bridge
  traefik-public:
    external: true
  chariot-group-network-integ:
    external: true