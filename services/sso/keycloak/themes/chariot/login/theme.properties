parent=keycloak
import=common/keycloak

# The parent theme's PatternFly v3/v4 stylesheets (~1.8 MB raw) are replaced by the subset
# actually used by these pages (css/patternfly-subset.css). @see FR-web-first-load-performance
stylesCommon=

# Inlined into every page by template.ftl (no render-blocking stylesheet request on slow networks).
# Paths are relative to resources/; url() to theme assets is re-pointed in template.ftl.
styles=
inlineStyles=css/patternfly-subset.css css/styles.css
themeVersion=20261107-1
