services:
  chariot-mongo:
    image: mongo:latest
    platform: linux/amd64
    container_name: chariot-mongodb
    restart: always
    ports:
      - "${CHARIOT_MONGO_PORT}:27017"
    volumes:
      - chariot_mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${CHARIOT_MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${CHARIOT_MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${CHARIOT_MONGO_INITDB_DATABASE}
    command:
      - "--logpath"
      - "/var/log/mongodb/mongod.log"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chariot-network

  chariot-backend:
    build:
      context: ../../
      dockerfile: services/chariot/backend/Dockerfile
    container_name: chariot-backend
    restart: always
    working_dir: /workspace/services/chariot/backend
    volumes:
      - ../../:/workspace
      - /workspace/node_modules
      - /workspace/services/chariot/backend/node_modules
    ports:
      - "${CHARIOT_API_PORT}:${CHARIOT_INTERNAL_API_PORT}"
    environment:
      - CHARIOT_API_PORT=${CHARIOT_API_PORT}
      - CHARIOT_MONGO_URL=${CHARIOT_MONGO_URL}
      - CHARIOT_FRONTEND_URL=${CHARIOT_FRONTEND_URL}
      - CHARIOT_BACKEND_URL=${CHARIOT_BACKEND_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - RECEIVER_EMAIL=${RECEIVER_EMAIL}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - ENVIRONMENT=${ENVIRONMENT}
      - DEFAULT_PASSWORD=${DEFAULT_PASSWORD}
      - CHARIOT_INTERNAL_API_PORT=${CHARIOT_INTERNAL_API_PORT}
      - KEYCLOAK_URL=${KEYCLOAK_URL}
      - KEYCLOAK_INTERNAL_URL=${KEYCLOAK_INTERNAL_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_ADMIN_USER=${KEYCLOAK_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      chariot-mongo:
        condition: service_healthy
    networks:
      - chariot-network
      - shared-network

  chariot-frontend:
    build:
      context: ../../
      dockerfile: services/chariot/frontend/Dockerfile
    platform: linux/amd64
    container_name: chariot-frontend
    restart: always
    working_dir: /workspace/services/chariot/frontend
    volumes:
      - ../../:/workspace
      - /workspace/node_modules
      - /workspace/services/chariot/frontend/node_modules
      - /var/log/frontend.log:/var/log/frontend.log
    ports:
      - "${CHARIOT_FRONT_PORT}:3000"
    depends_on:
      - chariot-backend
    environment:
      - CHARIOT_BACKEND_URL=${CHARIOT_BACKEND_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - ENVIRONMENT=${ENVIRONMENT}
      - NEXT_PUBLIC_KEYCLOAK_URL=${KEYCLOAK_URL}
      - NEXT_PUBLIC_KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
    command: ["npm", "run", "dev"]
    networks:
      - chariot-network
      - shared-network

volumes:
  chariot_mongodb_data:

networks:
  chariot-network:
    driver: bridge
  shared-network:
    name: shared-network
    external: true
