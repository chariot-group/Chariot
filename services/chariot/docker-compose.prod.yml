services:
  chariot-mongo:
    image: mongo:8.0.15
    platform: linux/amd64
    restart: unless-stopped
    command:
      - "--logpath"
      - "/var/log/mongodb/mongod.log"
      - "--logappend"
      - "--quiet"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  chariot-backend:
    build:
      context: ../../
      dockerfile: services/chariot/backend/Dockerfile.prod
    restart: unless-stopped
    volumes:
      - ./backend/logger/logs:/app/logger/logs
    command: ["node", "dist/main.js"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${CHARIOT_INTERNAL_API_PORT}/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  chariot-frontend:
    build:
      context: ../../
      dockerfile: services/chariot/frontend/Dockerfile.prod
    restart: unless-stopped
    command: ["node", "server.js"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
