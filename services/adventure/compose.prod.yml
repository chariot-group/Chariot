name: chariot-adventure-prod

services:
  chariot-mongo:
    image: mongo:latest
    platform: linux/amd64
    container_name: chariot-mongodb-prod
    restart: unless-stopped
    ports:
      - "27017"
    volumes:
      - chariot_mongodb_data_prod:/data/db
      - chariot_mongodb_logs_prod:/var/log/mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${CHARIOT_MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${CHARIOT_MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${CHARIOT_MONGO_INITDB_DATABASE}
    command: ["mongod", "--logpath", "/var/log/mongodb/mongod.log", "--logappend"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - chariot-network

  chariot-adventure:
    ports:
      - "9000:9000"
    image: ghcr.io/chariot-group/chariot-adventure-production:latest
    container_name: chariot-adventure-prod
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: production
      CHARIOT_MONGO_URL: ${CHARIOT_MONGO_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      ADVENTURE_URL: ${ADVENTURE_URL}
      ADVENTURE_VERSION: ${ADVENTURE_VERSION}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      RECEIVER_EMAIL: ${RECEIVER_EMAIL}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      METRICS_BASIC_AUTH_USER: ${METRICS_BASIC_AUTH_USER:-}
      METRICS_BASIC_AUTH_PASSWORD: ${METRICS_BASIC_AUTH_PASSWORD:-}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-}
      LOKI_ENABLED: ${LOKI_ENABLED:-false}
      LOKI_URL: ${LOKI_URL:-}
      LOKI_LOG_LEVEL: ${LOKI_LOG_LEVEL:-info}
    depends_on:
      chariot-mongo:
        condition: service_healthy
    networks:
      - chariot-network
      - chariot-group-network-prod
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  chariot_mongodb_data_prod:
  chariot_mongodb_logs_prod:
  chariot_adventure_logs_prod:

networks:
  chariot-network:
    driver: bridge
  chariot-group-network-prod:
    external: true
