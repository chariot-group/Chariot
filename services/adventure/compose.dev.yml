services:
  chariot-mongo:
    image: mongo:latest
    platform: linux/amd64
    container_name: chariot-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - chariot_mongodb_data:/data/db
      - chariot_mongodb_logs:/var/log/mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${CHARIOT_MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${CHARIOT_MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${CHARIOT_MONGO_INITDB_DATABASE}
    command: ["mongod", "--logpath", "/var/log/mongodb/mongod.log", "--logappend", "--wiredTigerCacheSizeGB", "0.5"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    tmpfs:
      - /tmp:size=100M,mode=1777
    shm_size: 256mb
    networks:
      - adventure-network

  chariot-adventure:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: chariot-adventure
    restart: unless-stopped
    working_dir: /app
    volumes:
      # Mount source code for hot reload
      - ./api:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      CHARIOT_MONGO_URL: ${CHARIOT_MONGO_URL}
      ADVENTURE_URL: ${ADVENTURE_URL}
      ADVENTURE_VERSION: ${ADVENTURE_VERSION}
      FRONTEND_URL: ${FRONTEND_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      RECEIVER_EMAIL: ${RECEIVER_EMAIL}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-chariot-app}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      SHOWCASE_URL: ${SHOWCASE_URL}
      CHARIOT_SESSION_API_URL: ${CHARIOT_SESSION_API_URL:-http://host.docker.internal:9002}
    depends_on:
      chariot-mongo:
        condition: service_healthy
    networks:
      - adventure-network
      - chariot-group-network
    extra_hosts:
      - "localhost:host-gateway"

volumes:
  chariot_mongodb_data:
  chariot_mongodb_logs:
  chariot_adventure_logs:

networks:
  adventure-network:
    driver: bridge
  chariot-group-network:
    external: true