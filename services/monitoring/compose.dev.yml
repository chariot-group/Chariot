name: chariot-monitoring-exporters-dev

services:
  alloy:
    image: grafana/alloy:v1.11.2
    container_name: chariot-alloy
    restart: unless-stopped
    pid: host
    ports:
      - "127.0.0.1:12345:12345"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ./blackbox.yml:/etc/alloy/blackbox.yml:ro
      - alloy_data:/var/lib/alloy/data
      # Ne pas monter `/` : sur Docker Desktop Mac ça traverse tout le disque
      # (dont web/admin) et relance les watchers Next/Vite en boucle.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
      - /etc/alloy/config.alloy
    environment:
      ALLOY_REMOTE_WRITE_URL: ${ALLOY_REMOTE_WRITE_URL:-http://host.docker.internal:9090/api/v1/write}
      ALLOY_REMOTE_WRITE_USER: ${ALLOY_REMOTE_WRITE_USER:-alloy}
      ALLOY_REMOTE_WRITE_PASSWORD: ${ALLOY_REMOTE_WRITE_PASSWORD:-changeme_use_a_strong_secret}
      METRICS_BASIC_AUTH_USER: ${METRICS_BASIC_AUTH_USER:-prometheus}
      METRICS_BASIC_AUTH_PASSWORD: ${METRICS_BASIC_AUTH_PASSWORD:-changeme_use_a_strong_secret}
      GATEWAY_ADDR: chariot-gateway:8082
      ADVENTURE_ADDR: chariot-adventure:9000
      PAYMENT_ADDR: chariot-payment:9003
      SESSION_ADDR: chariot-session:9002
      MEDIA_ADDR: chariot-media:9005
      WEB_ADDR: chariot-web:3000
      KEYCLOAK_ADDR: keycloak:9000
      READY_GATEWAY_URL: http://chariot-gateway:8082/ready
      READY_ADVENTURE_URL: http://chariot-adventure:9000/ready
      READY_PAYMENT_URL: http://chariot-payment:9003/ready
      READY_SESSION_URL: http://chariot-session:9002/ready
      READY_MEDIA_URL: http://chariot-media:9005/ready
      READY_WEB_URL: http://chariot-web:3000/api/ready
      READY_KEYCLOAK_URL: http://keycloak:9000/health/ready
      MONGODB_URI: ${MONGODB_EXPORTER_URI:-mongodb://admin:secret@chariot-mongodb:27017/?authSource=admin}
      REDIS_ADDR: ${REDIS_ADDR:-chariot-session-redis:6379}
      POSTGRES_SESSION_DSN: ${POSTGRES_EXPORTER_DSN:-postgresql://admin:admin@chariot-session-postgres:5432/chariot_session?sslmode=disable}
      POSTGRES_PAYMENT_DSN: ${POSTGRES_PAYMENT_EXPORTER_DSN:-postgresql://admin:admin@chariot-payment-postgres:5432/chariot_payment?sslmode=disable}
      UNIX_COLLECTORS: cpu,meminfo,loadavg,uname
      HOST_PROCFS: /host/proc
      HOST_SYSFS: /host/sys
      HOST_ROOTFS: /
    networks:
      - chariot-group-network

volumes:
  alloy_data:

networks:
  chariot-group-network:
    external: true
