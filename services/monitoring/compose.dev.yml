name: chariot-monitoring-exporters-dev

services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    platform: linux/amd64
    container_name: chariot-node-exporter
    restart: unless-stopped
    pid: host
    ports:
      - "9100:9100"
    command:
      # Ne pas monter `/` : sur Docker Desktop Mac ça traverse tout le disque
      # (dont web/admin) et relance les watchers Next/Vite en boucle.
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.disable-defaults"
      - "--collector.cpu"
      - "--collector.meminfo"
      - "--collector.loadavg"
      - "--collector.uname"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - chariot-group-network

  mongodb-exporter:
    image: percona/mongodb_exporter:0.43.1
    platform: linux/amd64
    container_name: chariot-mongodb-exporter
    restart: unless-stopped
    ports:
      - "9216:9216"
    environment:
      MONGODB_URI: ${MONGODB_EXPORTER_URI:-mongodb://admin:secret@chariot-mongodb:27017/?authSource=admin}
    command:
      - "--compatible-mode"
      - "--collect-all"
    networks:
      - chariot-group-network

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    platform: linux/amd64
    container_name: chariot-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: ${REDIS_EXPORTER_ADDR:-redis://chariot-session-redis:6379}
    networks:
      - chariot-group-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    platform: linux/amd64
    container_name: chariot-postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:-postgresql://admin:admin@chariot-session-postgres:5432/chariot_session?sslmode=disable}
    networks:
      - chariot-group-network

  postgres-exporter-payment:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    platform: linux/amd64
    container_name: chariot-postgres-exporter-payment
    restart: unless-stopped
    ports:
      - "9188:9187"
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_PAYMENT_EXPORTER_DSN:-postgresql://admin:admin@chariot-payment-postgres:5432/chariot_payment?sslmode=disable}
    networks:
      - chariot-group-network

networks:
  chariot-group-network:
    external: true
