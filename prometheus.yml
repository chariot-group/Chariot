global:
  # Collecte des métriques toutes les 15s
  scrape_interval: 15s
  
  # Intervalle d'évaluation des règles
  evaluation_interval: 15s
  
  # Labels externes ajoutés à toutes les métriques
  external_labels:
    monitor: 'chariot-monitor'
    environment: 'development'

# Configuration des jobs de collecte (scrape configs)
scrape_configs:
  # Job 1: Prometheus (auto-monitoring)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    
  # Job 2: Backend NestJS
  - job_name: 'chariot-backend'
    static_configs:
      - targets: ['backend:9000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    
  # Job 3: cAdvisor (métriques des containers Docker)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s
    
  # Job 4: Node Exporter (métriques de la machine hôte)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
  
  # Job 5: MongoDB Exporter (métriques de la base de données)
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']
    scrape_interval: 15s

