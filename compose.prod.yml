services:
  mongo:
    image: mongo:8.0.15
    container_name: mongodb
    restart: always
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
    command:
      - "--logpath"
      - "/var/log/mongodb/mongod.log"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: backend
    restart: always
    working_dir: /app
    ports:
      - "${API_PORT}:9000"
    environment:
      - API_PORT=${API_PORT}
      - MONGO_URL=${MONGO_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - BACKEND_URL=${BACKEND_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - RECEIVER_EMAIL=${RECEIVER_EMAIL}
      - SMTP_PASS=${SMTP_PASS}
      - NODE_ENV=${NODE_ENV}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: frontend
    restart: always
    working_dir: /app
    ports:
      - "${FRONT_PORT}:3000"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=${BACKEND_URL}
      - NODE_ENV=${NODE_ENV}

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      # Template de configuration
      - ./prometheus.yml.template:/etc/prometheus/prometheus.yml.template:ro
      # Règles d'alertes
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      # Stockage des données de métriques
      - prometheus_data:/prometheus
      # Entrypoint script
      - ./scripts/prometheus-entrypoint.sh:/usr/local/bin/prometheus-entrypoint.sh:ro
    env_file:
      - .env.prometheus
    entrypoint: ["/usr/local/bin/prometheus-entrypoint.sh"]
    command: 
      - "--config.file=prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    depends_on:
      - alertmanager
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Gestionnaire d'alertes Prometheus
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: always
    ports:
      - "${ALERTMANAGER_PORT}:9093"
    volumes:
      # Template de configuration
      - ./alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template:ro
      # Stockage des données d'alertes
      - alertmanager_data:/alertmanager
      # Entrypoint script
      - ./scripts/alertmanager-entrypoint.sh:/usr/local/bin/alertmanager-entrypoint.sh:ro
    env_file:
      - .env.prometheus
    entrypoint: ["/usr/local/bin/alertmanager-entrypoint.sh"]
    command: 
      - "--config.file=alertmanager.yml"
      - "--storage.path=/alertmanager"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Surveillance des containers Docker
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: always
    ports:
      - "${CADVISOR_PORT}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Collecte des métriques de la machine hôte
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: always
    ports:
      - "${NODE_EXPORTER_PORT}:9100"
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Outil pour collecter les métriques de MongoDB
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: mongodb-exporter
    restart: always
    ports:
      - "${MONGODB_EXPORTER_PORT}:9216"
    environment:
      # URI de connexion MongoDB avec authentification
      - MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017
    command:
      # Options de collecte des métriques
      - '--mongodb.direct-connect=true'
      - '--discovering-mode'
      - '--compatible-mode'
      - '--collect-all'
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9216/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Loki - Agregateur de logs centralisé
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    ports:
      - "${LOKI_PORT}:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
      - loki-storage:/loki
    command: -config.file=/etc/loki/local-config.yaml
    environment:
      - ENVIRONMENT=production
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Promtail - Agent de collecte des logs
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: always
    ports:
      - "${PROMTAIL_PORT}:9080"
    volumes:
      # Logs Winston du backend
      - ./backend/logger/logs:/logs/backend:ro
      # Logs Next.js du frontend
      - ./frontend/logs:/logs/frontend:ro
      # Logs MongoDB
      - ./mongo/logs:/logs/mongodb:ro
      # Configuration
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      # Positions (persistent state)
      - promtail-positions:/tmp/promtail
    command: -config.file=/etc/promtail/config.yml
    environment:
      - ENVIRONMENT=production
    depends_on:
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "test", "-f", "/proc/self/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mongodb_data:
  prometheus_data:
  alertmanager_data:
  loki-storage:
  promtail-positions:
