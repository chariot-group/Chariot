# Project identification
sonar.projectKey=Chariot-group_Chariot
sonar.organization=chariot-group

# Metadata
sonar.projectName=Chariot
sonar.projectVersion=1.0

# Source code - Microservices architecture
sonar.sources=services/chariot/frontend/src,services/chariot/backend/src,shared

# Exclure les branches de dépendances automatiques
sonar.exclusions=**/renovate/**

# Tests - uniquement les fichiers de test
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx

# Exclusions globales (évite les doublons)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.next/**,**/out/**,**/coverage/**,**/*.config.js,**/*.config.ts,**/public/**,**/build-wrapper-dump.json

# Exclusions de couverture
sonar.coverage.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.config.js,**/*.config.ts

# Coverage paths - Microservices architecture
sonar.typescript.lcov.reportPaths=services/chariot/frontend/coverage/lcov.info,services/chariot/backend/coverage/lcov.info
sonar.javascript.lcov.reportPaths=services/chariot/frontend/coverage/lcov.info,services/chariot/backend/coverage/lcov.info

# Source encoding
sonar.sourceEncoding=UTF-8

# Language settings
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Security
sonar.security.hotspots.enableAll=true