# Règles d'alertes pour les containers Docker (cAdvisor)
# Surveillance de la santé et des ressources des containers

groups:
  - name: container_alerts
    interval: 30s
    rules:
      # ==================== DISPONIBILITÉ ====================
      
      # Container down
      - alert: ContainerDown
        expr: time() - container_last_seen{name!~"POD|.*prometheus.*|.*alertmanager.*"} > 60
        for: 1m
        labels:
          severity: critical
          component: containers
        annotations:
          summary: "⚠️ Container {{ $labels.name }} est DOWN"
          description: "Le container {{ $labels.name }} sur {{ $labels.instance }} ne répond plus depuis {{ $value | humanizeDuration }}."
          runbook_url: "https://docs.chariot.com/runbooks/container-down"
      
      # cAdvisor down
      - alert: CAdvisorDown
        expr: up{job="cadvisor"} == 0
        for: 1m
        labels:
          severity: critical
          component: monitoring
        annotations:
          summary: "⚠️ cAdvisor ne répond plus"
          description: "cAdvisor est down depuis plus d'1 minute - Les métriques de containers ne sont plus collectées !"
          runbook_url: "https://docs.chariot.com/runbooks/cadvisor-down"
      
      # ==================== RESTARTS ====================
      
      # Redémarrages fréquents
      - alert: ContainerFrequentRestarts
        expr: rate(container_start_time_seconds{name!~"POD|.*prometheus.*|.*alertmanager.*"}[15m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: containers
        annotations:
          summary: "Redémarrages fréquents du container {{ $labels.name }}"
          description: "Le container {{ $labels.name }} redémarre fréquemment ({{ $value | humanize }} redémarrages/sec)."
          runbook_url: "https://docs.chariot.com/runbooks/container-restarts"
      
      # Container redémarré récemment
      - alert: ContainerRecentlyRestarted
        expr: time() - container_start_time_seconds{name!~"POD|.*prometheus.*|.*alertmanager.*"} < 300
        labels:
          severity: info
          component: containers
        annotations:
          summary: "Container {{ $labels.name }} a redémarré"
          description: "Le container {{ $labels.name }} a redémarré il y a {{ $value | humanizeDuration }}."
      
      # ==================== CPU ====================
      
      # Utilisation CPU élevée du container
      - alert: ContainerHighCpuUsage
        expr: (sum(rate(container_cpu_usage_seconds_total{name!~"POD|.*prometheus.*|.*alertmanager.*"}[5m])) by (name, instance) * 100) > 80
        for: 5m
        labels:
          severity: warning
          component: containers
          resource: cpu
        annotations:
          summary: "Utilisation CPU élevée pour le container {{ $labels.name }}"
          description: "Le container {{ $labels.name }} utilise {{ $value | humanize }}% du CPU depuis 5 minutes."
          runbook_url: "https://docs.chariot.com/runbooks/container-high-cpu"
      
      # CPU throttling élevé
      - alert: ContainerCpuThrottling
        expr: rate(container_cpu_cfs_throttled_seconds_total{name!~"POD|.*prometheus.*|.*alertmanager.*"}[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
          component: containers
          resource: cpu
        annotations:
          summary: "CPU throttling détecté sur {{ $labels.name }}"
          description: "Le container {{ $labels.name }} subit un throttling CPU de {{ $value | humanize }}s/s - Envisagez d'augmenter les limites CPU."
          runbook_url: "https://docs.chariot.com/runbooks/container-throttling"
      
      # ==================== MÉMOIRE ====================
      
      # Utilisation mémoire élevée du container
      - alert: ContainerHighMemoryUsage
        expr: (container_memory_working_set_bytes{name!~"POD|.*prometheus.*|.*alertmanager.*"} / container_spec_memory_limit_bytes{name!~"POD|.*prometheus.*|.*alertmanager.*"} * 100) > 80
        for: 5m
        labels:
          severity: warning
          component: containers
          resource: memory
        annotations:
          summary: "Utilisation mémoire élevée pour {{ $labels.name }}"
          description: "Le container {{ $labels.name }} utilise {{ $value | humanize }}% de sa limite mémoire."
          runbook_url: "https://docs.chariot.com/runbooks/container-high-memory"
      
      # Mémoire critique
      - alert: ContainerCriticalMemory
        expr: (container_memory_working_set_bytes{name!~"POD|.*prometheus.*|.*alertmanager.*"} / container_spec_memory_limit_bytes{name!~"POD|.*prometheus.*|.*alertmanager.*"} * 100) > 95
        for: 2m
        labels:
          severity: critical
          component: containers
          resource: memory
        annotations:
          summary: "⚠️ Mémoire CRITIQUE pour {{ $labels.name }}"
          description: "Le container {{ $labels.name }} utilise {{ $value | humanize }}% de sa limite - Risque d'OOM Kill !"
          runbook_url: "https://docs.chariot.com/runbooks/container-critical-memory"
      
      # OOM Kills détectés
      - alert: ContainerOOMKilled
        expr: increase(container_oom_events_total{name!~"POD|.*prometheus.*|.*alertmanager.*"}[5m]) > 0
        labels:
          severity: critical
          component: containers
          resource: memory
        annotations:
          summary: "⚠️ Container {{ $labels.name }} tué par OOM Killer"
          description: "Le container {{ $labels.name }} a été tué par l'OOM Killer {{ $value | humanize }} fois dans les 5 dernières minutes."
          runbook_url: "https://docs.chariot.com/runbooks/container-oom"
      
      # Cache mémoire élevé
      - alert: ContainerHighMemoryCache
        expr: (container_memory_cache{name!~"POD|.*prometheus.*|.*alertmanager.*"} / container_spec_memory_limit_bytes{name!~"POD|.*prometheus.*|.*alertmanager.*"} * 100) > 50
        for: 10m
        labels:
          severity: info
          component: containers
          resource: memory
        annotations:
          summary: "Cache mémoire élevé pour {{ $labels.name }}"
          description: "Le container {{ $labels.name }} utilise {{ $value | humanize }}% de sa limite en cache."
      
      # ==================== RÉSEAU ====================
      
      # Taux élevé d'erreurs réseau (réception)
      - alert: ContainerHighNetworkRxErrors
        expr: rate(container_network_receive_errors_total{name!~"POD|.*prometheus.*|.*alertmanager.*"}[5m]) > 10
        for: 5m
        labels:
          severity: warning
          component: containers
          resource: network
        annotations:
          summary: "Erreurs réseau RX élevées pour {{ $labels.name }}"
          description: "Le container {{ $labels.name }} reçoit {{ $value | humanize }} erreurs réseau/sec."
          runbook_url: "https://docs.chariot.com/runbooks/container-network-errors"
      
      # Taux élevé d'erreurs réseau (émission)
      - alert: ContainerHighNetworkTxErrors
        expr: rate(container_network_transmit_errors_total{name!~"POD|.*prometheus.*|.*alertmanager.*"}[5m]) > 10
        for: 5m
        labels:
          severity: warning
          component: containers
          resource: network
        annotations:
          summary: "Erreurs réseau TX élevées pour {{ $labels.name }}"
          description: "Le container {{ $labels.name }} génère {{ $value | humanize }} erreurs réseau/sec en émission."
          runbook_url: "https://docs.chariot.com/runbooks/container-network-errors"
      
      # Trafic réseau élevé (réception)
      - alert: ContainerHighNetworkRxTraffic
        expr: rate(container_network_receive_bytes_total{name!~"POD|.*prometheus.*|.*alertmanager.*"}[5m]) > 50 * 1024 * 1024
        for: 10m
        labels:
          severity: info
          component: containers
          resource: network
        annotations:
          summary: "Trafic réseau RX élevé pour {{ $labels.name }}"
          description: "Le container {{ $labels.name }} reçoit {{ $value | humanize }}B/s."
      
      # Trafic réseau élevé (émission)
      - alert: ContainerHighNetworkTxTraffic
        expr: rate(container_network_transmit_bytes_total{name!~"POD|.*prometheus.*|.*alertmanager.*"}[5m]) > 50 * 1024 * 1024
        for: 10m
        labels:
          severity: info
          component: containers
          resource: network
        annotations:
          summary: "Trafic réseau TX élevé pour {{ $labels.name }}"
          description: "Le container {{ $labels.name }} émet {{ $value | humanize }}B/s."
      
      # ==================== DISQUE I/O ====================
      
      # I/O disque élevé (lecture)
      - alert: ContainerHighDiskRead
        expr: rate(container_fs_reads_bytes_total{name!~"POD|.*prometheus.*|.*alertmanager.*"}[5m]) > 50 * 1024 * 1024
        for: 10m
        labels:
          severity: info
          component: containers
          resource: disk
        annotations:
          summary: "I/O disque lecture élevé pour {{ $labels.name }}"
          description: "Le container {{ $labels.name }} lit {{ $value | humanize }}B/s depuis le disque."
      
      # I/O disque élevé (écriture)
      - alert: ContainerHighDiskWrite
        expr: rate(container_fs_writes_bytes_total{name!~"POD|.*prometheus.*|.*alertmanager.*"}[5m]) > 50 * 1024 * 1024
        for: 10m
        labels:
          severity: info
          component: containers
          resource: disk
        annotations:
          summary: "I/O disque écriture élevé pour {{ $labels.name }}"
          description: "Le container {{ $labels.name }} écrit {{ $value | humanize }}B/s sur le disque."
      
      # ==================== CONTAINERS SPÉCIFIQUES ====================
      
      # Backend container down
      - alert: BackendContainerDown
        expr: absent(container_last_seen{name="backend"}) or (time() - container_last_seen{name="backend"} > 60)
        for: 1m
        labels:
          severity: critical
          component: application
          service: backend
        annotations:
          summary: "⚠️ Container Backend est DOWN"
          description: "Le container backend (NestJS) ne répond plus !"
          runbook_url: "https://docs.chariot.com/runbooks/backend-down"
      
      # Frontend container down
      - alert: FrontendContainerDown
        expr: absent(container_last_seen{name="frontend"}) or (time() - container_last_seen{name="frontend"} > 60)
        for: 1m
        labels:
          severity: critical
          component: application
          service: frontend
        annotations:
          summary: "⚠️ Container Frontend est DOWN"
          description: "Le container frontend (Next.js) ne répond plus !"
          runbook_url: "https://docs.chariot.com/runbooks/frontend-down"
      
      # MongoDB container down
      - alert: MongoDBContainerDown
        expr: absent(container_last_seen{name="mongodb"}) or (time() - container_last_seen{name="mongodb"} > 60)
        for: 1m
        labels:
          severity: critical
          component: mongodb
          service: database
        annotations:
          summary: "⚠️ Container MongoDB est DOWN"
          description: "Le container MongoDB ne répond plus !"
          runbook_url: "https://docs.chariot.com/runbooks/mongodb-container-down"
