groups:
  - name: mongodb_alerts
    interval: 30s
    rules:
      # ==================== DISPONIBILITÉ ====================
      
      # MongoDB down
      - alert: MongoDBDown
        expr: mongodb_up == 0
        for: 1m
        labels:
          severity: critical
          component: mongodb
          service: database
        annotations:
          summary: "⚠️ MongoDB est DOWN"
          description: "MongoDB sur {{ $labels.instance }} ne répond plus depuis plus d'1 minute !"
          runbook_url: "https://docs.chariot.com/runbooks/mongodb-down"
      
      # MongoDB Exporter down
      - alert: MongoDBExporterDown
        expr: up{job="mongodb"} == 0
        for: 1m
        labels:
          severity: critical
          component: monitoring
        annotations:
          summary: "⚠️ MongoDB Exporter ne répond plus"
          description: "Le MongoDB Exporter est down - Les métriques MongoDB ne sont plus collectées !"
          runbook_url: "https://docs.chariot.com/runbooks/mongodb-exporter-down"
      
      # MongoDB redémarré
      - alert: MongoDBRestarted
        expr: mongodb_instance_uptime_seconds < 300
        labels:
          severity: warning
          component: mongodb
        annotations:
          summary: "MongoDB a redémarré récemment"
          description: "MongoDB sur {{ $labels.instance }} est up depuis seulement {{ $value | humanizeDuration }}."
          runbook_url: "https://docs.chariot.com/runbooks/mongodb-restart"
      
      # ==================== CONNEXIONS ====================
      
      # Nombre élevé de connexions
      - alert: MongoDBHighConnections
        expr: mongodb_ss_connections{conn_type="current"} / mongodb_ss_connections{conn_type="available"} * 100 > 80
        for: 5m
        labels:
          severity: warning
          component: mongodb
          resource: connections
        annotations:
          summary: "Nombre élevé de connexions MongoDB"
          description: "{{ $value | humanize }}% des connexions disponibles sont utilisées sur {{ $labels.instance }}."
          runbook_url: "https://docs.chariot.com/runbooks/mongodb-high-connections"
      
      # Connexions critiques
      - alert: MongoDBCriticalConnections
        expr: mongodb_ss_connections{conn_type="current"} / mongodb_ss_connections{conn_type="available"} * 100 > 95
        for: 2m
        labels:
          severity: critical
          component: mongodb
          resource: connections
        annotations:
          summary: "⚠️ Nombre CRITIQUE de connexions MongoDB"
          description: "{{ $value | humanize }}% des connexions disponibles sont utilisées - Risque de rejet de nouvelles connexions !"
          runbook_url: "https://docs.chariot.com/runbooks/mongodb-critical-connections"
      
      # Taux élevé de nouvelles connexions
      - alert: MongoDBHighConnectionRate
        expr: rate(mongodb_ss_connections{conn_type="current"}[5m]) > 50
        for: 5m
        labels:
          severity: warning
          component: mongodb
          resource: connections
        annotations:
          summary: "Taux élevé de nouvelles connexions MongoDB"
          description: "{{ $value | humanize }} nouvelles connexions/sec sur {{ $labels.instance }}."
          runbook_url: "https://docs.chariot.com/runbooks/mongodb-high-connection-rate"
      
      # ==================== OPÉRATIONS ====================
      
      # Latence élevée des opérations
      - alert: MongoDBHighLatency
        expr: rate(mongodb_ss_opLatencies_latency{type="commands"}[5m]) / rate(mongodb_ss_opLatencies_ops{type="commands"}[5m]) > 1000000
        for: 10m
        labels:
          severity: warning
          component: mongodb
          resource: performance
        annotations:
          summary: "Latence élevée des opérations MongoDB"
          description: "Latence moyenne des commandes : {{ $value | humanize }}µs sur {{ $labels.instance }}."
          runbook_url: "https://docs.chariot.com/runbooks/mongodb-high-latency"
      
      # Taux élevé d'opérations lentes
      - alert: MongoDBSlowQueries
        expr: rate(mongodb_ss_opcounters{legacy_op_type="query"}[5m]) > 100
        for: 5m
        labels:
          severity: warning
          component: mongodb
          resource: performance
        annotations:
          summary: "Taux élevé de requêtes lentes MongoDB"
          description: "{{ $value | humanize }} requêtes lentes/sec détectées sur {{ $labels.instance }}."
          runbook_url: "https://docs.chariot.com/runbooks/mongodb-slow-queries"
      
      # Opérations en attente élevées
      - alert: MongoDBHighQueuedOperations
        expr: mongodb_ss_globalLock_currentQueue_total > 100
        for: 5m
        labels:
          severity: warning
          component: mongodb
          resource: performance
        annotations:
          summary: "File d'attente des opérations MongoDB élevée"
          description: "{{ $value | humanize }} opérations en attente sur {{ $labels.instance }}."
          runbook_url: "https://docs.chariot.com/runbooks/mongodb-queued-ops"
      
      # ==================== MÉMOIRE ====================
      
      # Utilisation mémoire résidente élevée
      - alert: MongoDBHighResidentMemory
        expr: mongodb_ss_mem_resident > 4096
        for: 10m
        labels:
          severity: warning
          component: mongodb
          resource: memory
        annotations:
          summary: "Utilisation mémoire résidente élevée MongoDB"
          description: "MongoDB utilise {{ $value | humanize }}MB de mémoire résidente sur {{ $labels.instance }}."
          runbook_url: "https://docs.chariot.com/runbooks/mongodb-high-memory"
      
      # Utilisation mémoire virtuelle élevée
      - alert: MongoDBHighVirtualMemory
        expr: mongodb_ss_mem_virtual > 8192
        for: 10m
        labels:
          severity: warning
          component: mongodb
          resource: memory
        annotations:
          summary: "Utilisation mémoire virtuelle élevée MongoDB"
          description: "MongoDB utilise {{ $value | humanize }}MB de mémoire virtuelle sur {{ $labels.instance }}."
          runbook_url: "https://docs.chariot.com/runbooks/mongodb-high-virtual-memory"
      
      # Cache WiredTiger plein
      - alert: MongoDBCacheFull
        expr: (mongodb_ss_wt_cache_bytes_currently_in_the_cache / mongodb_ss_wt_cache_maximum_bytes_configured * 100) > 90
        for: 5m
        labels:
          severity: warning
          component: mongodb
          resource: memory
        annotations:
          summary: "Cache WiredTiger presque plein"
          description: "Le cache WiredTiger est utilisé à {{ $value | humanize }}% sur {{ $labels.instance }}."
          runbook_url: "https://docs.chariot.com/runbooks/mongodb-cache-full"
      
      # ==================== CURSEURS ====================
      
      # Nombre élevé de curseurs ouverts
      - alert: MongoDBHighOpenCursors
        expr: mongodb_ss_metrics_cursor_open_total > 1000
        for: 10m
        labels:
          severity: warning
          component: mongodb
          resource: cursors
        annotations:
          summary: "Nombre élevé de curseurs ouverts MongoDB"
          description: "{{ $value | humanize }} curseurs ouverts sur {{ $labels.instance }} - Risque de fuite mémoire."
          runbook_url: "https://docs.chariot.com/runbooks/mongodb-high-cursors"
      
      # Curseurs expirés
      - alert: MongoDBCursorTimeouts
        expr: rate(mongodb_ss_metrics_cursor_timedOut[5m]) > 1
        for: 5m
        labels:
          severity: warning
          component: mongodb
          resource: cursors
        annotations:
          summary: "Timeouts de curseurs MongoDB"
          description: "{{ $value | humanize }} curseurs expirent par seconde sur {{ $labels.instance }}."
          runbook_url: "https://docs.chariot.com/runbooks/mongodb-cursor-timeouts"
      
      # ==================== RÉPLICATION ====================
      
      # Lag de réplication élevé (si réplication configurée)
      - alert: MongoDBReplicationLag
        expr: mongodb_mongod_replset_member_replication_lag > 10
        for: 5m
        labels:
          severity: warning
          component: mongodb
          resource: replication
        annotations:
          summary: "Lag de réplication élevé MongoDB"
          description: "Le membre {{ $labels.name }} a un lag de {{ $value | humanize }}s dans le replica set."
          runbook_url: "https://docs.chariot.com/runbooks/mongodb-replication-lag"
      
      # Membre du replica set down
      - alert: MongoDBReplicaSetMemberDown
        expr: mongodb_mongod_replset_member_health == 0
        for: 1m
        labels:
          severity: critical
          component: mongodb
          resource: replication
        annotations:
          summary: "⚠️ Membre du replica set MongoDB DOWN"
          description: "Le membre {{ $labels.name }} du replica set est DOWN !"
          runbook_url: "https://docs.chariot.com/runbooks/mongodb-replica-member-down"
      
      # ==================== SÉCURITÉ ====================
      
      # Taux élevé d'échecs d'authentification
      - alert: MongoDBHighAuthFailures
        expr: rate(mongodb_ss_extra_info_authentication_failed[5m]) > 5
        for: 5m
        labels:
          severity: warning
          component: mongodb
          resource: security
        annotations:
          summary: "Taux élevé d'échecs d'authentification MongoDB"
          description: "{{ $value | humanize }} échecs d'authentification/sec sur {{ $labels.instance }} - Possible attaque."
          runbook_url: "https://docs.chariot.com/runbooks/mongodb-auth-failures"
      
      # ==================== STOCKAGE ====================
      
      # Espace disque des données faible
      - alert: MongoDBLowDataDiskSpace
        expr: mongodb_ss_wt_cache_bytes_currently_in_the_cache > (mongodb_ss_wt_cache_maximum_bytes_configured * 0.9)
        for: 10m
        labels:
          severity: warning
          component: mongodb
          resource: disk
        annotations:
          summary: "Espace disque faible pour les données MongoDB"
          description: "L'espace utilisé approche la limite sur {{ $labels.instance }}."
          runbook_url: "https://docs.chariot.com/runbooks/mongodb-low-disk"
      
      # Taux élevé de pages dirty
      - alert: MongoDBHighDirtyPages
        expr: (mongodb_ss_wt_cache_modified_pages_evicted / mongodb_ss_wt_cache_unmodified_pages_evicted) > 0.5
        for: 10m
        labels:
          severity: warning
          component: mongodb
          resource: performance
        annotations:
          summary: "Taux élevé de pages dirty MongoDB"
          description: "Ratio de pages dirty évincées : {{ $value | humanize }} sur {{ $labels.instance }}."
          runbook_url: "https://docs.chariot.com/runbooks/mongodb-dirty-pages"
      
      # ==================== ASSERTS ====================
      
      # Asserts réguliers détectés
      - alert: MongoDBAsserts
        expr: rate(mongodb_ss_asserts[5m]) > 0
        for: 5m
        labels:
          severity: warning
          component: mongodb
          resource: stability
        annotations:
          summary: "Asserts MongoDB détectés"
          description: "Type {{ $labels.type }}: {{ $value | humanize }} asserts/sec sur {{ $labels.instance }}."
          runbook_url: "https://docs.chariot.com/runbooks/mongodb-asserts"
      
      # ==================== PERFORMANCES ====================
      
      # Taux élevé de scans de collection
      - alert: MongoDBHighCollectionScans
        expr: rate(mongodb_ss_metrics_queryExecutor_scanned[5m]) / rate(mongodb_ss_metrics_document_returned[5m]) > 1000
        for: 10m
        labels:
          severity: warning
          component: mongodb
          resource: performance
        annotations:
          summary: "Ratio scan/retour élevé MongoDB"
          description: "Ratio de {{ $value | humanize }} documents scannés par document retourné - Optimisez les index !"
          runbook_url: "https://docs.chariot.com/runbooks/mongodb-high-scans"
