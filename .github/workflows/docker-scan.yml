name: Docker Scan

on:
  workflow_call:
    outputs:
      has-critical-web:
        description: "Web Docker image has critical vulnerabilities"
        value: ${{ jobs.docker-scan-web.outputs.has-critical-web }}
      has-critical-backend:
        description: "Backend Docker image has critical vulnerabilities"
        value: ${{ jobs.docker-scan-adventure.outputs.has-critical-adventure }}

jobs:
  docker-scan-web:
    name: Scan des images Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    outputs:
      has-critical-web: ${{ steps.check-docker-web.outputs.has-critical }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check if Dockerfile exists
        id: check_dockerfile
        run: |
          if [ -f "services/adventure/api/dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Dockerfile not found for ${{ matrix.project }}"
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        if: steps.check_dockerfile.outputs.exists == 'true'
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: ./services/adventure/api
          file: ./services/adventure/api/dockerfile
          push: false
          load: true
          tags: web:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create reports directory
        if: steps.check_dockerfile.outputs.exists == 'true'
        run: mkdir -p security/reports

      - name: Run Trivy vulnerability scanner on image
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: web:scan
          format: 'json'
          output: 'security/reports/trivy-web.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Display vulnerabilities summary
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: web:scan
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Check for critical vulnerabilities
        if: steps.check_dockerfile.outputs.exists == 'true'
        id: check-docker-web
        working-directory: ./security/reports
        continue-on-error: true
        run: |
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-web.json 2>/dev/null || echo "0")
          if [ "$CRITICAL" -gt 0 ]; then
            echo "has-critical=true" >> $GITHUB_OUTPUT
          else
            echo "has-critical=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Docker scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-scan-web
          path: security/reports/
          retention-days: 30
          if-no-files-found: warn
    
  docker-scan-adventure:
    name: Scan des images Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    outputs:
      has-critical-adventure: ${{ steps.check-docker-adventure.outputs.has-critical }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check if Dockerfile exists
        id: check_dockerfile
        run: |
          if [ -f "services/adventure/api/dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Dockerfile not found for adventure"
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        if: steps.check_dockerfile.outputs.exists == 'true'
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: ./services/adventure/api
          file: ./services/adventure/api/dockerfile
          push: false
          load: true
          tags: adventure:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create reports directory
        if: steps.check_dockerfile.outputs.exists == 'true'
        run: mkdir -p security/reports

      - name: Run Trivy vulnerability scanner on image
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: adventure:scan
          format: 'json'
          output: 'security/reports/trivy-adventure.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Display vulnerabilities summary
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: adventure:scan
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Check for critical vulnerabilities
        if: steps.check_dockerfile.outputs.exists == 'true'
        id: check-docker-adventure
        working-directory: ./security/reports
        continue-on-error: true
        run: |
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-adventure.json 2>/dev/null || echo "0")
          if [ "$CRITICAL" -gt 0 ]; then
            echo "has-critical=true" >> $GITHUB_OUTPUT
          else
            echo "has-critical=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Docker scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-scan-adventure
          path: security/reports/
          retention-days: 30
          if-no-files-found: warn
