name: Security Scan

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
env:      
  NODE_VERSION: '20'
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
  MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
  MAIL_PORT: ${{ secrets.MAIL_PORT }}
  MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
  MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
  SECURITY_EMAIL: ${{ secrets.SECURITY_EMAIL }}

jobs:
  # ============================================
  # JOB 1: Scan des dépendances
  # ============================================
  dependency-scan:
    name: Scan des dépendances
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    strategy:
      matrix:
        project: [frontend, backend]
    
    outputs:
      has-critical-frontend: ${{ steps.check-vuln-frontend.outputs.has-critical }}
      has-critical-backend: ${{ steps.check-vuln-backend.outputs.has-critical }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js for ${{ matrix.project }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Cache Node dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: node-${{ runner.os }}-${{ env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            node-${{ runner.os }}-

      - name: Install dependencies
        working-directory: ./${{ matrix.project }}
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Create reports directory
        run: mkdir -p security/reports

      - name: Run Trivy dependency scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './${{ matrix.project }}'
          format: 'json'
          output: ${{ github.workspace }}/security/reports/trivy-deps-${{ matrix.project }}.json
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Check for critical vulnerabilities (frontend)
        if: matrix.project == 'frontend'
        id: check-vuln-frontend
        working-directory: ./security/reports
        continue-on-error: true
        run: |
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-deps-frontend.json 2>/dev/null || echo "0")
          if [ "$CRITICAL" -gt 0 ]; then
            echo "has-critical=true" >> $GITHUB_OUTPUT
          else
            echo "has-critical=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for critical vulnerabilities (backend)
        if: matrix.project == 'backend'
        id: check-vuln-backend
        working-directory: ./security/reports
        continue-on-error: true
        run: |
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-deps-backend.json 2>/dev/null || echo "0")
          if [ "$CRITICAL" -gt 0 ]; then
            echo "has-critical=true" >> $GITHUB_OUTPUT
          else
            echo "has-critical=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload dependency scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-scan-${{ matrix.project }}
          path: security/reports/
          retention-days: 30
          if-no-files-found: warn

  # ============================================
  # JOB 2: Scan des secrets
  # ============================================
  secret-scan:
    name: Détection de secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    outputs:
      secrets-found: ${{ steps.check-secrets.outputs.found }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run TruffleHog scan
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Check secrets result
        id: check-secrets
        run: |
          if [ "${{ steps.trufflehog.outcome }}" == "failure" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

  # ============================================
  # JOB 3: SAST avec SonarCloud (MONOREPO)
  # ============================================
  sast-scan:
    name: Analyse statique (SAST)
    if: ${{ !startsWith(github.ref, 'refs/heads/renovate/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # Installer les dépendances uniquement si elles existent
      - name: Install frontend dependencies
        if: ${{ hashFiles('frontend/package.json') != '' && hashFiles('frontend/package-lock.json') != '' }}
        working-directory: ./frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install backend dependencies
        if: ${{ hashFiles('backend/package.json') != '' && hashFiles('backend/package-lock.json') != '' }}
        working-directory: ./backend
        run: npm ci
      # Cache SonarCloud
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-cache-${{ runner.os }}-${{ hashFiles('**/sonar-project.properties') }}
          restore-keys: |
            sonar-cache-${{ runner.os }}-

      # Exécuter les tests backend
      - name: Run backend tests with coverage
        working-directory: ./backend
        continue-on-error: true
        run: |
          if npm run test:cov 2>/dev/null; then
            echo "✅ Backend tests completed with coverage"
          else
            echo "⚠️ Backend tests skipped or failed"
          fi

      # ✅ On conditionne seulement la step du scan SonarCloud
      - name: SonarCloud Scan (Monorepo)
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
  # ============================================
  # JOB 4: Build et scan des images Docker
  # ============================================
  docker-scan:
    name: Scan des images Docker
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      security-events: write
    
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, backend]
    
    outputs:
      has-critical-frontend: ${{ steps.check-docker-frontend.outputs.has-critical }}
      has-critical-backend: ${{ steps.check-docker-backend.outputs.has-critical }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check if Dockerfile exists
        id: check_dockerfile
        run: |
          if [ -f "${{ matrix.project }}/dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Dockerfile not found for ${{ matrix.project }}"
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: steps.check_dockerfile.outputs.exists == 'true'
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.project }}
          file: ./${{ matrix.project }}/dockerfile
          push: false
          load: true
          tags: ${{ matrix.project }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create reports directory
        if: steps.check_dockerfile.outputs.exists == 'true'
        run: mkdir -p security/reports

      - name: Run Trivy vulnerability scanner on image
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ matrix.project }}:scan
          format: 'json'
          output: 'security/reports/trivy-${{ matrix.project }}.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Display vulnerabilities summary
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ matrix.project }}:scan
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Check for critical vulnerabilities (frontend)
        if: steps.check_dockerfile.outputs.exists == 'true' && matrix.project == 'frontend'
        id: check-docker-frontend
        working-directory: ./security/reports
        continue-on-error: true
        run: |
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-frontend.json 2>/dev/null || echo "0")
          if [ "$CRITICAL" -gt 0 ]; then
            echo "has-critical=true" >> $GITHUB_OUTPUT
          else
            echo "has-critical=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for critical vulnerabilities (backend)
        if: steps.check_dockerfile.outputs.exists == 'true' && matrix.project == 'backend'
        id: check-docker-backend
        working-directory: ./security/reports
        continue-on-error: true
        run: |
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-backend.json 2>/dev/null || echo "0")
          if [ "$CRITICAL" -gt 0 ]; then
            echo "has-critical=true" >> $GITHUB_OUTPUT
          else
            echo "has-critical=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Docker scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-scan-${{ matrix.project }}
          path: security/reports/
          retention-days: 30
          if-no-files-found: warn

  # ============================================
  # JOB 5: Rapport et notifications
  # ============================================
  security-report:
    name: Rapport et notifications
    runs-on: ubuntu-latest
    needs: [dependency-scan, secret-scan, docker-scan, sast-scan]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download all scan reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: security/reports/

      - name: Determine severity
        id: severity
        run: |
          DEP_STATUS="${{ needs.dependency-scan.result }}"
          SECRET_STATUS="${{ needs.secret-scan.result }}"
          DOCKER_STATUS="${{ needs.docker-scan.result }}"
          SAST_STATUS="${{ needs.sast-scan.result }}"
          
          HAS_CRITICAL_DEP_FE="${{ needs.dependency-scan.outputs.has-critical-frontend }}"
          HAS_CRITICAL_DEP_BE="${{ needs.dependency-scan.outputs.has-critical-backend }}"
          HAS_CRITICAL_DOCKER_FE="${{ needs.docker-scan.outputs.has-critical-frontend }}"
          HAS_CRITICAL_DOCKER_BE="${{ needs.docker-scan.outputs.has-critical-backend }}"
          HAS_SECRETS="${{ needs.secret-scan.outputs.secrets-found }}"
          
          if [[ "$HAS_CRITICAL_DEP_FE" == "true" ]] || \
             [[ "$HAS_CRITICAL_DEP_BE" == "true" ]] || \
             [[ "$HAS_CRITICAL_DOCKER_FE" == "true" ]] || \
             [[ "$HAS_CRITICAL_DOCKER_BE" == "true" ]] || \
             [[ "$HAS_SECRETS" == "true" ]]; then
            echo "level=critical" >> $GITHUB_OUTPUT
            echo "🚨 CRITICAL issues detected"
          elif [[ "$DEP_STATUS" == "failure" ]] || \
               [[ "$DOCKER_STATUS" == "failure" ]] || \
               [[ "$SAST_STATUS" == "failure" ]]; then
            echo "level=warning" >> $GITHUB_OUTPUT
            echo "⚠️ WARNING level issues detected"
          else
            echo "level=success" >> $GITHUB_OUTPUT
            echo "✅ All checks passed"
          fi

      - name: Generate summary with critical vulnerability details
        id: summary
        run: |
          mkdir -p security/reports

          HAS_CRITICAL_DEP_FE="${{ needs.dependency-scan.outputs.has-critical-frontend }}"
          HAS_CRITICAL_DEP_BE="${{ needs.dependency-scan.outputs.has-critical-backend }}"
          HAS_CRITICAL_DOCKER_FE="${{ needs.docker-scan.outputs.has-critical-frontend }}"
          HAS_CRITICAL_DOCKER_BE="${{ needs.docker-scan.outputs.has-critical-backend }}"
          HAS_SECRETS="${{ needs.secret-scan.outputs.secrets-found }}"

          # Déterminer emoji et statut par type de scan
          if [[ "$HAS_CRITICAL_DEP_FE" == "true" ]] || [[ "$HAS_CRITICAL_DEP_BE" == "true" ]]; then
            DEP_EMOJI="⚠️"; DEP_STATUS="failure"
          else
            DEP_EMOJI="✅"; DEP_STATUS="success"
          fi

          if [[ "$HAS_CRITICAL_DOCKER_FE" == "true" ]] || [[ "$HAS_CRITICAL_DOCKER_BE" == "true" ]]; then
            DOCKER_EMOJI="⚠️"; DOCKER_STATUS="failure"
          else
            DOCKER_EMOJI="✅"; DOCKER_STATUS="success"
          fi

          if [[ "$HAS_SECRETS" == "true" ]]; then
            SECRET_EMOJI="⚠️"; SECRET_STATUS="failure"
          else
            SECRET_EMOJI="✅"; SECRET_STATUS="success"
          fi

          # SAST
          SAST_STATUS="${{ needs.sast-scan.result }}"
          if [[ "$SAST_STATUS" == "success" ]]; then SAST_EMOJI="✅"; elif [[ "$SAST_STATUS" == "skipped" ]]; then SAST_EMOJI="⏭️"; else SAST_EMOJI="⚠️"; fi

          # Générer le Markdown initial
          cat > security/reports/summary.md << EOF
          # 🔒 Rapport de Sécurité

          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")  
          **Branch:** \`${{ github.ref_name }}\`  
          **Commit:** [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})  
          **Auteur:** @${{ github.actor }}

          ## 📊 Résultats des Scans

          | Type de Scan | Frontend | Backend | Statut Global |
          |--------------|----------|---------|---------------|
          | 📦 Dépendances | $DEP_EMOJI | $DEP_EMOJI | $DEP_STATUS |
          | 🔍 SAST (Code) | $SAST_EMOJI | $SAST_EMOJI | $SAST_STATUS |
          | 🐳 Docker | $DOCKER_EMOJI | $DOCKER_EMOJI | $DOCKER_STATUS |
          | 🔑 Secrets | - | - | $SECRET_EMOJI $SECRET_STATUS |

          ## 🎯 Niveau de sévérité : **${{ steps.severity.outputs.level }}**

          EOF

          if [ "${{ steps.severity.outputs.level }}" == "critical" ]; then
            cat >> security/reports/summary.md << EOF
          ## ⚠️ Actions Requises

          - 🚨 Des vulnérabilités CRITIQUES ont été détectées
          - 📧 Une notification email a été envoyée
          - 🔒 Correction URGENTE requise avant merge

          EOF
          fi

          echo "## 📝 Détail des vulnérabilités CRITIQUES détectées" >> security/reports/summary.md
          echo "" >> security/reports/summary.md

          FOUND_CRITICAL="false"

          print_table_header() {
            echo "| Package/Image | Version | CVE | Sévérité | Emplacement |" >> security/reports/summary.md
            echo "|--------------|---------|-----|----------|-------------|" >> security/reports/summary.md
          }

          # === 1. NPM AUDIT JSON FILES ===
          for JSON in security/reports/npm-audit-frontend.json security/reports/npm-audit-backend.json; do
            if [ -f "$JSON" ]; then
              CRIT_COUNT=$(jq '[.advisories[]] | length' "$JSON" 2>/dev/null || echo "0")
              if [ "$CRIT_COUNT" != "0" ] && [ "$CRIT_COUNT" -gt 0 ]; then
                FOUND_CRITICAL="true"
                echo "### 📦 Dépendances ($(basename "$JSON"))" >> security/reports/summary.md
                print_table_header
                jq -r '.advisories[] | 
                  [ .module_name, .findings[0].version, (.cves[0] // .url // "N/A"), .severity, .findings[0].paths[0] ] | 
                  @tsv' "$JSON" | \
                  while IFS=$'\t' read -r pkg ver cve sev loc; do
                    echo "| $pkg | $ver | $cve | $sev | $loc |" >> security/reports/summary.md
                  done
                echo "" >> security/reports/summary.md
              fi
            fi
          done

          # === 2. TRIVY JSON FILES ===
          for JSON in security/reports/docker-scan-frontend/trivy-frontend.json security/reports/docker-scan-backend/trivy-backend.json; do
            if [ -f "$JSON" ]; then
              # Compter les vulnérabilités critiques
              CRIT_COUNT=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$JSON" 2>/dev/null || echo "0")
              
              if [ "$CRIT_COUNT" != "0" ] && [ "$CRIT_COUNT" -gt 0 ]; then
                FOUND_CRITICAL="true"
                
                # Déterminer le nom du service (frontend/backend)
                SERVICE_NAME=$(basename "$(dirname "$JSON")" | sed 's/docker-scan-//')
                
                echo "### 🐳 Trivy - $SERVICE_NAME" >> security/reports/summary.md
                print_table_header
                
                # Extraire et formater les vulnérabilités critiques
                jq -r '
                  .Results[]? 
                  | .Vulnerabilities[]? 
                  | [
                      .PkgName // "N/A",
                      .InstalledVersion // "N/A",
                      .VulnerabilityID // "N/A",
                      .Severity // "N/A",
                      (.PrimaryURL // "N/A")
                    ] 
                  | @tsv
                ' "$JSON" 2>/dev/null | \
                while IFS=$'\t' read -r pkg ver cve sev url; do
                  # Créer un lien cliquable pour l'URL
                  if [ "$url" != "N/A" ]; then
                    url_link="[$cve]($url)"
                  else
                    url_link="$cve"
                  fi
                  echo "| $pkg | $ver | $cve | $sev | $url |" >> security/reports/summary.md
                done
                
                echo "" >> security/reports/summary.md
              fi
            fi
          done

          # Si aucune vulnérabilité critique trouvée
          if [ "$FOUND_CRITICAL" != "true" ]; then
            echo "_Aucune vulnérabilité critique détectée dans les rapports._" >> security/reports/summary.md
          fi

          echo "" >> security/reports/summary.md
          echo "---" >> security/reports/summary.md
          echo "" >> security/reports/summary.md
          echo "**[📊 Voir les détails complets](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})**" >> security/reports/summary.md
          echo "**[🔒 GitHub Security](${{ github.server_url }}/${{ github.repository }}/security)**" >> security/reports/summary.md

          cat security/reports/summary.md

      # ============================================
      # NOTIFICATIONS DISCORD
      # ============================================
      - name: Send Discord notification (Warning)
        if: steps.severity.outputs.level == 'warning' && env.DISCORD_WEBHOOK != ''
        continue-on-error: true
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "embeds": [{
                "title": "⚠️ Security Scan - Problèmes Mineurs",
                "description": "Des problèmes de sécurité mineurs ont été détectés",
                "color": 16753920,
                "fields": [
                  {
                    "name": "Branch",
                    "value": "'"${{ github.ref_name }}"'",
                    "inline": true
                  },
                  {
                    "name": "Commit",
                    "value": "'"${GITHUB_SHA:0:7}"'",
                    "inline": true
                  },
                  {
                    "name": "Action",
                    "value": "Vérifier les rapports",
                    "inline": true
                  }
                ],
                "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
              }]
            }' \
            "${{ env.DISCORD_WEBHOOK }}"

      - name: Send Discord notification (Critical)
        if: steps.severity.outputs.level == 'critical' && env.DISCORD_WEBHOOK != ''
        continue-on-error: true
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "content": "@here",
              "embeds": [{
                "title": "🚨 ALERTE CRITIQUE - Vulnérabilités Détectées",
                "description": "**Des vulnérabilités CRITIQUES ont été détectées !**\n\nAction immédiate requise.",
                "color": 16711680,
                "fields": [
                  {
                    "name": "Branch",
                    "value": "'"${{ github.ref_name }}"'",
                    "inline": true
                  },
                  {
                    "name": "Commit",
                    "value": "'"${GITHUB_SHA:0:7}"'",
                    "inline": true
                  },
                  {
                    "name": "⚠️ Priorité",
                    "value": "**URGENT**",
                    "inline": true
                  }
                ],
                "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
              }]
            }' \
            "${{ env.DISCORD_WEBHOOK }}"

      # ============================================
      # NOTIFICATION EMAIL (HOSTINGER)
      # ============================================
      - name: Send email notification (Critical)
        if: steps.severity.outputs.level == 'critical' && env.MAIL_SERVER != ''
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.MAIL_SERVER }}
          server_port: ${{ env.MAIL_PORT }}
          username: ${{ env.MAIL_USERNAME }}
          password: ${{ env.MAIL_PASSWORD }}
          subject: '🚨 CRITIQUE: Vulnérabilités de sécurité - ${{ github.repository }}'
          to: ${{ env.SECURITY_EMAIL }}
          from: ${{ env.MAIL_USERNAME }}
          html_body: |
            <!DOCTYPE html>
            <html>
            <head>
              <style>
                body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
                .header { background-color: #dc3545; color: white; padding: 20px; text-align: center; }
                .content { padding: 20px; }
                .info { background-color: #f8f9fa; border-left: 4px solid #dc3545; padding: 15px; margin: 20px 0; }
                .button { background-color: #dc3545; color: white; padding: 10px 20px; text-decoration: none; display: inline-block; margin: 10px 0; border-radius: 5px; }
                .footer { background-color: #f8f9fa; padding: 15px; text-align: center; margin-top: 30px; font-size: 12px; color: #666; }
              </style>
            </head>
            <body>
              <div class="header">
                <h1>🚨 Alerte de Sécurité Critique</h1>
              </div>
              <div class="content">
                <p><strong>Des vulnérabilités critiques ont été détectées dans votre dépôt.</strong></p>
                
                <div class="info">
                  <p><strong>Repository:</strong> ${{ github.repository }}</p>
                  <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
                  <p><strong>Commit:</strong> ${{ github.sha }}</p>
                  <p><strong>Auteur:</strong> ${{ github.actor }}</p>
                  <p><strong>Date:</strong> $(date -u +"%Y-%m-%d %H:%M:%S UTC")</p>
                </div>
                
                <h3>⚠️ Action Requise</h3>
                <p>Une action immédiate est nécessaire pour corriger ces vulnérabilités avant tout déploiement en production.</p>
                
                <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" class="button">
                  Voir le rapport détaillé
                </a>
                
                <h3>📋 Prochaines étapes</h3>
                <ol>
                  <li>Consultez le rapport complet sur GitHub Actions</li>
                  <li>Identifiez les vulnérabilités critiques</li>
                  <li>Appliquez les correctifs recommandés</li>
                  <li>Relancez le scan de sécurité</li>
                </ol>
              </div>
              <div class="footer">
                <p>Ce message a été généré automatiquement par le système de scan de sécurité.</p>
                <p>GitHub Actions - Security Scanner</p>
              </div>
            </body>
            </html>

      # ============================================
      # AUTRES ACTIONS
      # ============================================
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ env.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            try {
              const summary = fs.readFileSync('security/reports/summary.md', 'utf8');
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            } catch (error) {
              console.log('Could not post comment:', error.message);
            }

      - name: Upload consolidated report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report-final
          path: security/reports/
          retention-days: 90
          if-no-files-found: warn

      - name: Job Summary
        if: always()
        run: |
          if [ -f security/reports/summary.md ]; then
            cat security/reports/summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "# 🔒 Security Scan Completed" >> $GITHUB_STEP_SUMMARY
            echo "Check the artifacts for detailed reports." >> $GITHUB_STEP_SUMMARY
          fi