name: Security Scan

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

env:      
  NODE_VERSION: '20'
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
  MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
  MAIL_PORT: ${{ secrets.MAIL_PORT }}
  MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
  MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
  SECURITY_EMAIL: ${{ secrets.SECURITY_EMAIL }}

jobs:
  # ============================================
  # JOB 1: Scan des dépendances
  # ============================================
  dependency-scan:
    name: Scan des dépendances
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    strategy:
      matrix:
        project: [frontend, backend]
    
    outputs:
      has-critical-frontend: ${{ steps.check-vuln-frontend.outputs.has-critical }}
      has-critical-backend: ${{ steps.check-vuln-backend.outputs.has-critical }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js for ${{ matrix.project }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Cache Node dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: node-${{ runner.os }}-${{ env.NODE_VERSION }}-${{ hashFiles(format('{0}/package-lock.json', matrix.project)) }}
          restore-keys: |
            node-${{ runner.os }}-${{ env.NODE_VERSION }}-

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: |
            trivy-db-

      - name: Install dependencies
        working-directory: ./${{ matrix.project }}
        run: npm ci --prefer-offline --no-audit --no-fund --ignore-scripts

      - name: Create reports directory
        run: mkdir -p security/reports

      - name: Run Trivy dependency scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './${{ matrix.project }}'
          format: 'json'
          output: ${{ github.workspace }}/security/reports/trivy-deps-${{ matrix.project }}.json
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Check for critical vulnerabilities (frontend)
        if: matrix.project == 'frontend'
        id: check-vuln-frontend
        working-directory: ./security/reports
        continue-on-error: true
        run: |
          CRITICAL=$(jq -s 'map(.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")) | length' trivy-deps-frontend.json 2>/dev/null || echo "0")
          echo "has-critical=$([ "$CRITICAL" -gt 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Check for critical vulnerabilities (backend)
        if: matrix.project == 'backend'
        id: check-vuln-backend
        working-directory: ./security/reports
        continue-on-error: true
        run: |
          CRITICAL=$(jq -s 'map(.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")) | length' trivy-deps-backend.json 2>/dev/null || echo "0")
          echo "has-critical=$([ "$CRITICAL" -gt 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Compress reports
        if: steps.check-vuln-frontend.outputs.has-critical == 'true' || steps.check-vuln-backend.outputs.has-critical == 'true'
        run: tar -czf security-reports-deps-${{ matrix.project }}.tar.gz security/reports

      - name: Upload dependency scan reports
        uses: actions/upload-artifact@v4
        if: steps.check-vuln-frontend.outputs.has-critical == 'true' || steps.check-vuln-backend.outputs.has-critical == 'true'
        with:
          name: dependency-scan-${{ matrix.project }}
          path: security-reports-deps-${{ matrix.project }}.tar.gz
          retention-days: 30
          compression-level: 9

  # ============================================
  # JOB 2: Scan des secrets
  # ============================================
  secret-scan:
    name: Détection de secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    outputs:
      secrets-found: ${{ steps.check-secrets.outputs.found }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run TruffleHog scan
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Check secrets result
        id: check-secrets
        run: |
          echo "found=$([ '${{ steps.trufflehog.outcome }}' == 'failure' ] && echo true || echo false)" >> $GITHUB_OUTPUT

  # ============================================
  # JOB 3: SAST avec SonarCloud (MONOREPO)
  # ============================================
  sast-scan:
    name: Analyse statique (SAST)
    if: ${{ !startsWith(github.ref, 'refs/heads/renovate/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: ./frontend
        run: npm ci --prefer-offline --no-audit --no-fund --ignore-scripts

      - name: Install backend dependencies
        if: hashFiles('backend/package-lock.json') != ''
        working-directory: ./backend
        run: npm ci --prefer-offline --no-audit --no-fund --ignore-scripts

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ hashFiles('**/sonar-project.properties') }}
          restore-keys: sonar-${{ runner.os }}-

      - name: Run backend tests with coverage
        working-directory: ./backend
        continue-on-error: true
        run: npm run test:cov 2>/dev/null || echo "Tests skipped"

      - name: SonarCloud Scan (Monorepo)
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

  # ============================================
  # JOB 4A: Build et scan Docker Frontend
  # ============================================
  docker-scan-frontend:
    name: Scan Docker Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    outputs:
      has-critical: ${{ steps.check-docker.outputs.has-critical }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Check if Dockerfile exists
        id: check_dockerfile
        run: |
          if [ -f "frontend/dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⏭️ Dockerfile not found for frontend, skipping"
          fi

      - name: Set up Docker Buildx
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Cache Trivy DB
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Build Docker image
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/dockerfile
          push: false
          load: true
          tags: frontend:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create reports directory
        if: steps.check_dockerfile.outputs.exists == 'true'
        run: mkdir -p security/reports

      - name: Run Trivy vulnerability scanner on image
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend:scan
          format: 'json'
          output: 'security/reports/trivy-frontend.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Check for critical vulnerabilities
        if: steps.check_dockerfile.outputs.exists == 'true'
        id: check-docker
        working-directory: ./security/reports
        continue-on-error: true
        run: |
          CRITICAL=$(jq -s 'map(.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")) | length' trivy-frontend.json 2>/dev/null || echo "0")
          echo "has-critical=$([ "$CRITICAL" -gt 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Compress reports
        if: steps.check_dockerfile.outputs.exists == 'true' && steps.check-docker.outputs.has-critical == 'true'
        run: tar -czf security-reports-docker-frontend.tar.gz security/reports

      - name: Upload Docker scan reports
        if: steps.check_dockerfile.outputs.exists == 'true' && steps.check-docker.outputs.has-critical == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docker-scan-frontend
          path: security-reports-docker-frontend.tar.gz
          retention-days: 30
          compression-level: 9

  # ============================================
  # JOB 4B: Build et scan Docker Backend
  # ============================================
  docker-scan-backend:
    name: Scan Docker Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    outputs:
      has-critical: ${{ steps.check-docker.outputs.has-critical }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Check if Dockerfile exists
        id: check_dockerfile
        run: |
          if [ -f "backend/dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⏭️ Dockerfile not found for backend, skipping"
          fi

      - name: Set up Docker Buildx
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Cache Trivy DB
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Build Docker image
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/dockerfile
          push: false
          load: true
          tags: backend:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create reports directory
        if: steps.check_dockerfile.outputs.exists == 'true'
        run: mkdir -p security/reports

      - name: Run Trivy vulnerability scanner on image
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend:scan
          format: 'json'
          output: 'security/reports/trivy-backend.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Check for critical vulnerabilities
        if: steps.check_dockerfile.outputs.exists == 'true'
        id: check-docker
        working-directory: ./security/reports
        continue-on-error: true
        run: |
          CRITICAL=$(jq -s 'map(.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")) | length' trivy-backend.json 2>/dev/null || echo "0")
          echo "has-critical=$([ "$CRITICAL" -gt 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Compress reports
        if: steps.check_dockerfile.outputs.exists == 'true' && steps.check-docker.outputs.has-critical == 'true'
        run: tar -czf security-reports-docker-backend.tar.gz security/reports

      - name: Upload Docker scan reports
        if: steps.check_dockerfile.outputs.exists == 'true' && steps.check-docker.outputs.has-critical == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docker-scan-backend
          path: security-reports-docker-backend.tar.gz
          retention-days: 30
          compression-level: 9

  # ============================================
  # JOB 5: Rapport et notifications
  # ============================================
  security-report:
    name: Rapport et notifications
    runs-on: ubuntu-latest
    needs: [dependency-scan, secret-scan, docker-scan-frontend, docker-scan-backend]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download all scan reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: security/reports/

      - name: Determine severity
        id: severity
        run: |
          HAS_CRITICAL_DEP_FE="${{ needs.dependency-scan.outputs.has-critical-frontend }}"
          HAS_CRITICAL_DEP_BE="${{ needs.dependency-scan.outputs.has-critical-backend }}"
          HAS_CRITICAL_DOCKER_FE="${{ needs.docker-scan-frontend.outputs.has-critical }}"
          HAS_CRITICAL_DOCKER_BE="${{ needs.docker-scan-backend.outputs.has-critical }}"
          HAS_SECRETS="${{ needs.secret-scan.outputs.secrets-found }}"
          
          if [[ "$HAS_CRITICAL_DEP_FE" == "true" ]] || \
             [[ "$HAS_CRITICAL_DEP_BE" == "true" ]] || \
             [[ "$HAS_CRITICAL_DOCKER_FE" == "true" ]] || \
             [[ "$HAS_CRITICAL_DOCKER_BE" == "true" ]] || \
             [[ "$HAS_SECRETS" == "true" ]]; then
            echo "level=critical" >> $GITHUB_OUTPUT
            echo "🚨 CRITICAL issues detected"
          else
            DEP_STATUS="${{ needs.dependency-scan.result }}"
            DOCKER_FE_STATUS="${{ needs.docker-scan-frontend.result }}"
            DOCKER_BE_STATUS="${{ needs.docker-scan-backend.result }}"
            SAST_STATUS="${{ needs.sast-scan.result }}"
            
            if [[ "$DEP_STATUS" == "failure" ]] || \
               [[ "$DOCKER_FE_STATUS" == "failure" ]] || \
               [[ "$DOCKER_BE_STATUS" == "failure" ]] || \
               [[ "$SAST_STATUS" == "failure" ]]; then
              echo "level=warning" >> $GITHUB_OUTPUT
              echo "⚠️ WARNING level issues detected"
            else
              echo "level=success" >> $GITHUB_OUTPUT
              echo "✅ All checks passed"
            fi
          fi

      - name: Generate summary report
        id: summary
        run: |
          mkdir -p security/reports
          
          HAS_CRITICAL_DEP_FE="${{ needs.dependency-scan.outputs.has-critical-frontend }}"
          HAS_CRITICAL_DEP_BE="${{ needs.dependency-scan.outputs.has-critical-backend }}"
          HAS_CRITICAL_DOCKER_FE="${{ needs.docker-scan-frontend.outputs.has-critical }}"
          HAS_CRITICAL_DOCKER_BE="${{ needs.docker-scan-backend.outputs.has-critical }}"
          HAS_SECRETS="${{ needs.secret-scan.outputs.secrets-found }}"
          
          # Déterminer les emojis
          DEP_EMOJI=$([ "$HAS_CRITICAL_DEP_FE" == "true" ] || [ "$HAS_CRITICAL_DEP_BE" == "true" ] && echo "⚠️" || echo "✅")
          DOCKER_EMOJI=$([ "$HAS_CRITICAL_DOCKER_FE" == "true" ] || [ "$HAS_CRITICAL_DOCKER_BE" == "true" ] && echo "⚠️" || echo "✅")
          SECRET_EMOJI=$([ "$HAS_SECRETS" == "true" ] && echo "⚠️" || echo "✅")
          
          SAST_STATUS="${{ needs.sast-scan.result }}"
          SAST_EMOJI=$([ "$SAST_STATUS" == "success" ] && echo "✅" || ([ "$SAST_STATUS" == "skipped" ] && echo "⏭️" || echo "⚠️"))
          
          cat > security/reports/summary.md << EOF
          # 🔒 Rapport de Sécurité
          
          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")  
          **Branch:** \`${{ github.ref_name }}\`  
          **Commit:** [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})  
          **Auteur:** @${{ github.actor }}
          
          ## 📊 Résultats des Scans
          
          | Type de Scan | Frontend | Backend | Statut Global |
          |--------------|----------|---------|---------------|
          | 📦 Dépendances | $DEP_EMOJI | $DEP_EMOJI | $([ "$HAS_CRITICAL_DEP_FE" == "true" ] || [ "$HAS_CRITICAL_DEP_BE" == "true" ] && echo "failure" || echo "success") |
          | 🔍 SAST | $SAST_EMOJI | $SAST_EMOJI | $SAST_STATUS |
          | 🐳 Docker | $DOCKER_EMOJI | $DOCKER_EMOJI | $([ "$HAS_CRITICAL_DOCKER_FE" == "true" ] || [ "$HAS_CRITICAL_DOCKER_BE" == "true" ] && echo "failure" || echo "success") |
          | 🔑 Secrets | - | - | $SECRET_EMOJI $([ "$HAS_SECRETS" == "true" ] && echo "failure" || echo "success") |
          
          ## 🎯 Niveau de sévérité : **${{ steps.severity.outputs.level }}**
          
          EOF
          
          if [ "${{ steps.severity.outputs.level }}" == "critical" ]; then
            cat >> security/reports/summary.md << EOF
          ## ⚠️ Actions Requises
          
          - 🚨 Des vulnérabilités CRITIQUES ont été détectées
          - 📧 Une notification email a été envoyée
          - 🔒 Correction URGENTE requise avant merge
          
          EOF
          fi
          
          echo "## 📝 Détails des vulnérabilités critiques" >> security/reports/summary.md
          echo "" >> security/reports/summary.md
          
          FOUND_CRITICAL="false"
          
          # Scanner tous les fichiers JSON Trivy
          for JSON_FILE in $(find security/reports -name "*.json" -type f 2>/dev/null); do
            CRITICAL_COUNT=$(jq -s 'map(.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")) | length' "$JSON_FILE" 2>/dev/null || echo "0")
            
            if [ "$CRITICAL_COUNT" -gt 0 ]; then
              FOUND_CRITICAL="true"
              FILENAME=$(basename "$JSON_FILE")
              
              echo "### 🔍 $FILENAME ($CRITICAL_COUNT vulnérabilités critiques)" >> security/reports/summary.md
              echo "" >> security/reports/summary.md
              echo "| Package | Version | CVE | Sévérité |" >> security/reports/summary.md
              echo "|---------|---------|-----|----------|" >> security/reports/summary.md
              
              jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL") | 
                [.PkgName // "N/A", .InstalledVersion // "N/A", .VulnerabilityID // "N/A", .Severity] | 
                @tsv' "$JSON_FILE" 2>/dev/null | \
              while IFS=$'\t' read -r pkg ver cve sev; do
                echo "| $pkg | $ver | $cve | $sev |" >> security/reports/summary.md
              done
              
              echo "" >> security/reports/summary.md
            fi
          done
          
          if [ "$FOUND_CRITICAL" != "true" ]; then
            echo "_Aucune vulnérabilité critique détectée._" >> security/reports/summary.md
          fi
          
          echo "" >> security/reports/summary.md
          echo "---" >> security/reports/summary.md
          echo "**[📊 Détails complets](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})**" >> security/reports/summary.md

      - name: Send Discord notification (Critical)
        if: steps.severity.outputs.level == 'critical' && env.DISCORD_WEBHOOK != ''
        continue-on-error: true
        run: |
          curl -H "Content-Type: application/json" -X POST -d '{
            "content": "@here",
            "embeds": [{
              "title": "🚨 ALERTE CRITIQUE - Vulnérabilités Détectées",
              "description": "**Des vulnérabilités CRITIQUES ont été détectées !**\n\nAction immédiate requise.",
              "color": 16711680,
              "fields": [
                {"name": "Branch", "value": "'"${{ github.ref_name }}"'", "inline": true},
                {"name": "Commit", "value": "'"${GITHUB_SHA:0:7}"'", "inline": true},
                {"name": "⚠️ Priorité", "value": "**URGENT**", "inline": true}
              ],
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
            }]
          }' "${{ env.DISCORD_WEBHOOK }}"

      - name: Send email notification (Critical)
        if: steps.severity.outputs.level == 'critical' && env.MAIL_SERVER != ''
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.MAIL_SERVER }}
          server_port: ${{ env.MAIL_PORT }}
          username: ${{ env.MAIL_USERNAME }}
          password: ${{ env.MAIL_PASSWORD }}
          subject: '🚨 CRITIQUE: Vulnérabilités - ${{ github.repository }}'
          to: ${{ env.SECURITY_EMAIL }}
          from: ${{ env.MAIL_USERNAME }}
          html_body: |
            <!DOCTYPE html>
            <html>
            <head>
              <style>
                body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
                .header { background-color: #dc3545; color: white; padding: 20px; text-align: center; }
                .content { padding: 20px; }
                .info { background-color: #f8f9fa; border-left: 4px solid #dc3545; padding: 15px; margin: 20px 0; }
                .button { background-color: #dc3545; color: white; padding: 10px 20px; text-decoration: none; display: inline-block; margin: 10px 0; border-radius: 5px; }
              </style>
            </head>
            <body>
              <div class="header"><h1>🚨 Alerte de Sécurité Critique</h1></div>
              <div class="content">
                <p><strong>Des vulnérabilités critiques ont été détectées.</strong></p>
                <div class="info">
                  <p><strong>Repository:</strong> ${{ github.repository }}</p>
                  <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
                  <p><strong>Commit:</strong> ${{ github.sha }}</p>
                  <p><strong>Auteur:</strong> ${{ github.actor }}</p>
                </div>
                <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" class="button">Voir le rapport</a>
              </div>
            </body>
            </html>

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            try {
              const summary = fs.readFileSync('security/reports/summary.md', 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            } catch (error) {
              console.log('Could not post comment:', error.message);
            }

      - name: Compress final report
        if: always()
        run: tar -czf security-report-final.tar.gz security/reports

      - name: Upload consolidated report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report-final
          path: security-report-final.tar.gz
          retention-days: 90
          compression-level: 9

      - name: Job Summary
        if: always()
        run: |
          if [ -f security/reports/summary.md ]; then
            cat security/reports/summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "# 🔒 Security Scan Completed" >> $GITHUB_STEP_SUMMARY
            echo "Check artifacts for detailed reports." >> $GITHUB_STEP_SUMMARY
          fi