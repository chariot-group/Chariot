name: Security Scan

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # JOB 1: Scan des dépendances
  # ============================================
  dependency-scan:
    name: Scan des dépendances
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    strategy:
      matrix:
        project: [frontend, backend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js for ${{ matrix.project }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ./${{ matrix.project }}
        run: npm ci

      - name: Run npm audit
        id: npm-audit
        working-directory: ./${{ matrix.project }}
        continue-on-error: true
        run: |
          mkdir -p ../../security/reports
          npm audit --json > ../../security/reports/npm-audit-${{ matrix.project }}.json || true
          echo "📦 Scanning ${{ matrix.project }} dependencies..."
          npm audit --audit-level=moderate || echo "Vulnerabilities found but continuing..."

      - name: Run Trivy dependency scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './${{ matrix.project }}'
          format: 'sarif'
          output: 'security/reports/trivy-deps-${{ matrix.project }}.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'  # Ne pas faire échouer le job

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'security/reports/trivy-deps-${{ matrix.project }}.sarif'
          category: 'dependencies-${{ matrix.project }}'

      - name: Check for critical vulnerabilities
        working-directory: ./security/reports
        continue-on-error: true
        run: |
          if [ -f "npm-audit-${{ matrix.project }}.json" ]; then
            CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit-${{ matrix.project }}.json)
            HIGH=$(jq '.metadata.vulnerabilities.high // 0' npm-audit-${{ matrix.project }}.json)
            MODERATE=$(jq '.metadata.vulnerabilities.moderate // 0' npm-audit-${{ matrix.project }}.json)
            
            echo "🔍 ${{ matrix.project }}: $CRITICAL critical, $HIGH high, $MODERATE moderate"
            
            if [ "$CRITICAL" -gt 0 ]; then
              echo "⚠️ $CRITICAL critical vulnerabilities found in ${{ matrix.project }}"
              echo "status=failed" >> $GITHUB_OUTPUT
            else
              echo "✅ No critical vulnerabilities"
              echo "status=passed" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Upload dependency scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-scan-${{ matrix.project }}
          path: security/reports/
          retention-days: 30
          if-no-files-found: warn

  # ============================================
  # JOB 2: Scan des secrets (VERSION GRATUITE)
  # ============================================
  secret-scan:
    name: Détection de secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # TruffleHog est gratuit et ne nécessite pas de licence
      - name: Run TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      # Alternative : Scan manuel avec git-secrets
      - name: Install git-secrets
        run: |
          git clone https://github.com/awslabs/git-secrets.git
          cd git-secrets
          sudo make install
          cd ..
          rm -rf git-secrets

      - name: Run git-secrets scan
        continue-on-error: true
        run: |
          git secrets --install
          git secrets --register-aws
          git secrets --scan-history || echo "Secrets scan completed with findings"

  # ============================================
  # JOB 3: Build et scan des images Docker
  # ============================================
  docker-scan:
    name: Scan des images Docker
    runs-on: ubuntu-latest
    needs: [dependency-scan]
    if: always()
    permissions:
      contents: read
      security-events: write
    
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, backend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check if Dockerfile exists
        id: check_dockerfile
        run: |
          if [ -f "${{ matrix.project }}/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Dockerfile found for ${{ matrix.project }}"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ No Dockerfile found for ${{ matrix.project }}"
          fi

      - name: Set up Docker Buildx
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: steps.check_dockerfile.outputs.exists == 'true'
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.project }}
          file: ./${{ matrix.project }}/Dockerfile
          push: false
          load: true
          tags: ${{ matrix.project }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create reports directory
        if: steps.check_dockerfile.outputs.exists == 'true'
        run: mkdir -p security/reports

      - name: Run Trivy vulnerability scanner on image
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ matrix.project }}:scan
          format: 'sarif'
          output: 'security/reports/trivy-${{ matrix.project }}.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Display vulnerabilities summary
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ matrix.project }}:scan
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: 'security/reports/trivy-${{ matrix.project }}.sarif'
          category: 'docker-${{ matrix.project }}'

      - name: Check for critical vulnerabilities
        if: steps.check_dockerfile.outputs.exists == 'true'
        continue-on-error: true
        run: |
          # Installer trivy CLI si besoin
          if ! command -v trivy &> /dev/null; then
            wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
            echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
            sudo apt-get update
            sudo apt-get install -y trivy
          fi
          
          CRITICAL_COUNT=$(trivy image --severity CRITICAL --format json ${{ matrix.project }}:scan 2>/dev/null | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' || echo "0")
          echo "Critical vulnerabilities found: $CRITICAL_COUNT"
          
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "⚠️ $CRITICAL_COUNT critical vulnerabilities found in Docker image"
          else
            echo "✅ No critical vulnerabilities in Docker image"
          fi

      - name: Upload Docker scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-scan-${{ matrix.project }}
          path: security/reports/
          retention-days: 30
          if-no-files-found: warn

  # ============================================
  # JOB 4: Rapport final SANS notifications
  # ============================================
  security-report:
    name: Rapport de sécurité
    runs-on: ubuntu-latest
    needs: [dependency-scan, secret-scan, docker-scan]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download all scan reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: security/reports/

      - name: Generate summary
        id: summary
        run: |
          mkdir -p security/reports
          
          DEP_STATUS="${{ needs.dependency-scan.result }}"
          SECRET_STATUS="${{ needs.secret-scan.result }}"
          DOCKER_STATUS="${{ needs.docker-scan.result }}"
          
          # Emoji de statut
          if [ "$DEP_STATUS" == "success" ]; then DEP_EMOJI="✅"; else DEP_EMOJI="⚠️"; fi
          if [ "$SECRET_STATUS" == "success" ]; then SECRET_EMOJI="✅"; else SECRET_EMOJI="⚠️"; fi
          if [ "$DOCKER_STATUS" == "success" ]; then DOCKER_EMOJI="✅"; else DOCKER_EMOJI="⚠️"; fi
          
          cat > security/reports/summary.md << EOF
          # 🔒 Rapport de Sécurité
          
          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")  
          **Branch:** \`${{ github.ref_name }}\`  
          **Commit:** [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})  
          **Auteur:** @${{ github.actor }}
          
          ## 📊 Résultats des Scans
          
          | Type de Scan | Statut |
          |--------------|--------|
          | 📦 Dépendances (frontend) | $DEP_EMOJI $DEP_STATUS |
          | 📦 Dépendances (backend) | $DEP_EMOJI $DEP_STATUS |
          | 🔑 Secrets | $SECRET_EMOJI $SECRET_STATUS |
          | 🐳 Docker Images | $DOCKER_EMOJI $DOCKER_STATUS |
          
          ## 📝 Actions recommandées
          
          EOF
          
          if [ "$DEP_STATUS" != "success" ]; then
            echo "- ⚠️ Vérifier les vulnérabilités des dépendances" >> security/reports/summary.md
          fi
          if [ "$SECRET_STATUS" != "success" ]; then
            echo "- ⚠️ Vérifier les secrets potentiellement exposés" >> security/reports/summary.md
          fi
          if [ "$DOCKER_STATUS" != "success" ]; then
            echo "- ⚠️ Vérifier les vulnérabilités des images Docker" >> security/reports/summary.md
          fi
          
          cat >> security/reports/summary.md << EOF
          
          ---
          
          **[📊 Voir les détails complets](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})**
          EOF
          
          cat security/reports/summary.md
          
          # Statut global (ne pas faire échouer le workflow)
          if [[ "$DEP_STATUS" == "failure" ]] || [[ "$SECRET_STATUS" == "failure" ]] || [[ "$DOCKER_STATUS" == "failure" ]]; then
            echo "severity=warning" >> $GITHUB_OUTPUT
            echo "⚠️ Some security checks reported issues"
          else
            echo "severity=success" >> $GITHUB_OUTPUT
            echo "✅ All security checks completed"
          fi

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            try {
              const summary = fs.readFileSync('security/reports/summary.md', 'utf8');
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            } catch (error) {
              console.log('Could not post comment:', error.message);
            }

      - name: Upload consolidated report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report-final
          path: security/reports/
          retention-days: 90
          if-no-files-found: warn

      - name: Job Summary
        if: always()
        run: |
          if [ -f security/reports/summary.md ]; then
            cat security/reports/summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "# 🔒 Security Scan Completed" >> $GITHUB_STEP_SUMMARY
            echo "Check the artifacts for detailed reports." >> $GITHUB_STEP_SUMMARY
          fi