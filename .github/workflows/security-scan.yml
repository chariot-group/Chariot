name: Security Scan

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

env:      
  NODE_VERSION: '20'

jobs:
  dependency-scan:
    name: Scan des dépendances
    uses: ./.github/workflows/securitySteps/dependency-scan.yml
    secrets: inherit
    with:
      node-version: '20'

  secret-scan:
    name: Détection de secrets
    uses: ./.github/workflows/securitySteps/secret-scan.yml
    secrets: inherit

  sast-scan:
    name: Analyse statique (SAST)
    if: ${{ !startsWith(github.ref, 'refs/heads/renovate/') }}
    uses: ./.github/workflows/securitySteps/sast-scan.yml
    secrets: inherit
    with:
      node-version: '20'

  docker-scan:
    name: Scan des images Docker
    uses: ./.github/workflows/securitySteps/docker-scan.yml
    secrets: inherit

  security-report:
    name: Rapport et notifications
    needs: [dependency-scan, secret-scan, sast-scan, docker-scan]
    if: always()
    uses: ./.github/workflows/securitySteps/security-report.yml
    secrets: inherit
    with:
      dependency-scan-result: ${{ needs.dependency-scan.result }}
      secret-scan-result: ${{ needs.secret-scan.result }}
      sast-scan-result: ${{ needs.sast-scan.result }}
      docker-scan-result: ${{ needs.docker-scan.result }}
      has-critical-dep-frontend: ${{ needs.dependency-scan.outputs.has-critical-frontend }}
      has-critical-dep-backend: ${{ needs.dependency-scan.outputs.has-critical-backend }}
      has-critical-docker-frontend: ${{ needs.docker-scan.outputs.has-critical-frontend }}
      has-critical-docker-backend: ${{ needs.docker-scan.outputs.has-critical-backend }}
      secrets-found: ${{ needs.secret-scan.outputs.secrets-found }}