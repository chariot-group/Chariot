name: Security Scan

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # JOB 1: Scan des dépendances
  # ============================================
  dependency-scan:
    name: Scan des dépendances
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    strategy:
      matrix:
        project: [frontend, backend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js for ${{ matrix.project }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ./${{ matrix.project }}
        run: npm ci

      - name: Run npm audit
        id: npm-audit
        working-directory: ./${{ matrix.project }}
        continue-on-error: true
        run: |
          mkdir -p ../../security/reports
          npm audit --json > ../../security/reports/npm-audit-${{ matrix.project }}.json
          npm audit --audit-level=moderate

      - name: Run Trivy dependency scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './${{ matrix.project }}'
          format: 'sarif'
          output: 'security/reports/trivy-deps-${{ matrix.project }}.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          trivyignores: 'security/.trivyignore'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'security/reports/trivy-deps-${{ matrix.project }}.sarif'
          category: 'dependencies-${{ matrix.project }}'

      - name: Check for critical vulnerabilities
        working-directory: ./security/reports
        run: |
          if [ -f "npm-audit-${{ matrix.project }}.json" ]; then
            CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit-${{ matrix.project }}.json)
            HIGH=$(jq '.metadata.vulnerabilities.high // 0' npm-audit-${{ matrix.project }}.json)
            
            echo "🔍 ${{ matrix.project }}: $CRITICAL critical, $HIGH high vulnerabilities"
            
            if [ "$CRITICAL" -gt 0 ]; then
              echo "❌ Critical vulnerabilities found in ${{ matrix.project }}!"
              exit 1
            fi
          fi

      - name: Upload dependency scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-scan-${{ matrix.project }}
          path: security/reports/
          retention-days: 30

  # ============================================
  # JOB 2: Scan des secrets
  # ============================================
  secret-scan:
    name: Détection de secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ============================================
  # JOB 3: SAST avec SonarCloud
  # ============================================
  sast-scan:
    name: Analyse statique (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    strategy:
      matrix:
        project: [frontend, backend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ./${{ matrix.project }}
        run: npm ci

      - name: Run tests with coverage
        working-directory: ./${{ matrix.project }}
        if: matrix.project == 'backend'
        continue-on-error: true
        run: npm test -- --coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ./${{ matrix.project }}
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}_${{ matrix.project }}
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true

  # ============================================
  # JOB 4: Build et scan des images Docker
  # ============================================
  docker-scan:
    name: Scan des images Docker
    runs-on: ubuntu-latest
    needs: [dependency-scan]
    permissions:
      contents: read
      security-events: write
    
    strategy:
      matrix:
        project: [frontend, backend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.project }}
          file: ./${{ matrix.project }}/Dockerfile
          push: false
          load: true
          tags: ${{ matrix.project }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner on image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.project }}:scan
          format: 'sarif'
          output: 'security/reports/trivy-${{ matrix.project }}.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          trivyignores: 'security/.trivyignore'

      - name: Run Trivy vulnerability scanner (table output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.project }}:scan
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          trivyignores: 'security/.trivyignore'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'security/reports/trivy-${{ matrix.project }}.sarif'
          category: 'docker-${{ matrix.project }}'

      - name: Check for critical vulnerabilities
        run: |
          # Installer trivy si pas déjà installé
          if ! command -v trivy &> /dev/null; then
            wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
            echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
            sudo apt-get update
            sudo apt-get install trivy
          fi
          
          CRITICAL_COUNT=$(trivy image --severity CRITICAL --format json ${{ matrix.project }}:scan | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length')
          echo "Critical vulnerabilities found: $CRITICAL_COUNT"
          
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ $CRITICAL_COUNT critical vulnerabilities found in Docker image!"
            exit 1
          fi

      - name: Upload Docker scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-scan-${{ matrix.project }}
          path: security/reports/
          retention-days: 30

  # ============================================
  # JOB 5: Rapport et notifications
  # ============================================
  security-report:
    name: Rapport de sécurité
    runs-on: ubuntu-latest
    needs: [dependency-scan, secret-scan, sast-scan, docker-scan]
    if: always()
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download all scan reports
        uses: actions/download-artifact@v4
        with:
          path: security/reports/

      - name: Generate summary
        id: summary
        run: |
          mkdir -p security/reports
          
          # Déterminer le statut global
          DEP_STATUS="${{ needs.dependency-scan.result }}"
          SECRET_STATUS="${{ needs.secret-scan.result }}"
          SAST_STATUS="${{ needs.sast-scan.result }}"
          DOCKER_STATUS="${{ needs.docker-scan.result }}"
          
          # Créer le rapport
          cat > security/reports/summary.md << EOF
          # 🔒 Rapport de Sécurité
          
          **Workflow:** ${{ github.workflow }}
          **Run:** #${{ github.run_number }}
          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Commit:** \`${{ github.sha }}\`
          **Branch:** \`${{ github.ref_name }}\`
          **Auteur:** ${{ github.actor }}
          
          ## 📊 Résultats des Scans
          
          | Type de Scan | Frontend | Backend | Statut Global |
          |--------------|----------|---------|---------------|
          | 📦 Dépendances | $DEP_STATUS | $DEP_STATUS | $DEP_STATUS |
          | 🔑 Secrets | - | - | $SECRET_STATUS |
          | 🔍 SAST | $SAST_STATUS | $SAST_STATUS | $SAST_STATUS |
          | 🐳 Docker | $DOCKER_STATUS | $DOCKER_STATUS | $DOCKER_STATUS |
          
          ---
          
          **Lien vers le workflow:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          
          # Déterminer la sévérité
          if [[ "$DEP_STATUS" == "failure" ]] || [[ "$SECRET_STATUS" == "failure" ]] || [[ "$DOCKER_STATUS" == "failure" ]]; then
            echo "severity=critical" >> $GITHUB_OUTPUT
          elif [[ "$SAST_STATUS" == "failure" ]]; then
            echo "severity=warning" >> $GITHUB_OUTPUT
          else
            echo "severity=success" >> $GITHUB_OUTPUT
          fi

      - name: Send Discord notification (Success)
        if: steps.summary.outputs.severity == 'success'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: 'success'
          title: '✅ Security Scan Passed'
          description: |
            Tous les scans de sécurité sont passés avec succès !
            Branch: `${{ github.ref_name }}`
            Commit: `${{ github.sha }}`
          color: 0x00ff00
          username: Security Bot

      - name: Send Discord notification (Warning)
        if: steps.summary.outputs.severity == 'warning'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: 'warning'
          title: '⚠️ Security Scan - Problèmes Mineurs'
          description: |
            Des problèmes mineurs ont été détectés.
            Branch: `${{ github.ref_name }}`
            Consultez le rapport pour plus de détails.
          color: 0xffa500
          username: Security Bot

      - name: Send Discord notification (Critical)
        if: steps.summary.outputs.severity == 'critical'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: 'failure'
          title: '🚨 CRITIQUE - Vulnérabilités Détectées'
          description: |
            Des vulnérabilités critiques ont été détectées !
            Branch: `${{ github.ref_name }}`
            **Action requise immédiatement**
          color: 0xff0000
          username: Security Bot

      - name: Send email (Critical only)
        if: steps.summary.outputs.severity == 'critical'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: '🚨 CRITIQUE: Vulnérabilités de sécurité détectées'
          to: ${{ secrets.SECURITY_EMAIL }}
          from: 'Security Scanner <security@yourdomain.com>'
          body: |
            Des vulnérabilités critiques ont été détectées dans le dépôt.
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Auteur: ${{ github.actor }}
            
            Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Veuillez consulter les rapports de sécurité immédiatement.
          attachments: security/reports/summary.md

      - name: Upload consolidated report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report-final
          path: security/reports/
          retention-days: 90

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('security/reports/summary.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });