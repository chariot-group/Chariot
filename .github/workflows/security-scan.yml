name: Security Scan

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
env:
  NODE_VERSION: '20'
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
  MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
  MAIL_PORT: ${{ secrets.MAIL_PORT }}
  MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
  MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
  SECURITY_EMAIL: ${{ secrets.SECURITY_EMAIL }}

jobs:
  # ============================================
  # JOB 1: Scan des dépendances
  # ============================================
  dependency-scan:
    name: Scan des dépendances
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    strategy:
      matrix:
        project: [frontend, backend]
    
    outputs:
      has-critical-frontend: ${{ steps.check-vuln-frontend.outputs.has-critical }}
      has-critical-backend: ${{ steps.check-vuln-backend.outputs.has-critical }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js for ${{ matrix.project }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ./${{ matrix.project }}
        run: npm ci

      - name: Run npm audit
        id: npm-audit
        working-directory: ./${{ matrix.project }}
        continue-on-error: true
        run: |
              mkdir -p ../security/reports
              npm audit --json > ../security/reports/npm-audit-${{ matrix.project }}.json || true
              echo "📦 Scanning ${{ matrix.project }} dependencies..."
              npm audit --audit-level=moderate || echo "Vulnerabilities found"

      - name: Run Trivy dependency scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './${{ matrix.project }}'
          format: 'sarif'
          output: ${{ github.workspace }}/security/reports/trivy-deps-${{ matrix.project }}.sarif
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'security/reports/trivy-deps-${{ matrix.project }}.sarif'
          category: 'dependencies-${{ matrix.project }}'

      - name: Check for critical vulnerabilities (frontend)
        if: matrix.project == 'frontend'
        id: check-vuln-frontend
        working-directory: ./security/reports
        continue-on-error: true
        run: |
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit-frontend.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' npm-audit-frontend.json)
          
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          
          if [ "$CRITICAL" -gt 0 ]; then
            echo "has-critical=true" >> $GITHUB_OUTPUT
          else
            echo "has-critical=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for critical vulnerabilities (backend)
        if: matrix.project == 'backend'
        id: check-vuln-backend
        working-directory: ./security/reports
        continue-on-error: true
        run: |
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit-backend.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' npm-audit-backend.json)
          
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          
          if [ "$CRITICAL" -gt 0 ]; then
            echo "has-critical=true" >> $GITHUB_OUTPUT
          else
            echo "has-critical=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload dependency scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-scan-${{ matrix.project }}
          path: security/reports/
          retention-days: 30
          if-no-files-found: warn

  # ============================================
  # JOB 2: Scan des secrets
  # ============================================
  secret-scan:
    name: Détection de secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    outputs:
      secrets-found: ${{ steps.check-secrets.outputs.found }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run TruffleHog scan
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Check secrets result
        id: check-secrets
        run: |
          if [ "${{ steps.trufflehog.outcome }}" == "failure" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

  # ============================================
  # JOB 3: SAST avec SonarCloud (MONOREPO)
  # ============================================
  sast-scan:
    name: Analyse statique (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Installer les dépendances
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      # Exécuter les tests backend
      - name: Run backend tests with coverage
        working-directory: ./backend
        continue-on-error: true
        run: |
          if npm run test:cov 2>/dev/null; then
            echo "✅ Backend tests completed with coverage"
          else
            echo "⚠️ Backend tests skipped or failed"
          fi

      # ✅ On conditionne seulement la step du scan SonarCloud
      - name: SonarCloud Scan (Monorepo)
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
  # ============================================
  # JOB 4: Build et scan des images Docker
  # ============================================
  docker-scan:
    name: Scan des images Docker
    runs-on: ubuntu-latest
    needs: [dependency-scan]
    if: always()
    permissions:
      contents: read
      security-events: write
    
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, backend]
    
    outputs:
      has-critical-frontend: ${{ steps.check-docker-frontend.outputs.has-critical }}
      has-critical-backend: ${{ steps.check-docker-backend.outputs.has-critical }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check if Dockerfile exists
        id: check_dockerfile
        run: |
          if [ -f "${{ matrix.project }}/dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Dockerfile not found for ${{ matrix.project }}"
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: steps.check_dockerfile.outputs.exists == 'true'
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.project }}
          file: ./${{ matrix.project }}/dockerfile
          push: false
          load: true
          tags: ${{ matrix.project }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create reports directory
        if: steps.check_dockerfile.outputs.exists == 'true'
        run: mkdir -p security/reports

      - name: Run Trivy vulnerability scanner on image
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ matrix.project }}:scan
          format: 'sarif'
          output: 'security/reports/trivy-${{ matrix.project }}.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Display vulnerabilities summary
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ matrix.project }}:scan
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        if: steps.check_dockerfile.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: 'security/reports/trivy-${{ matrix.project }}.sarif'
          category: 'docker-${{ matrix.project }}'

      - name: Check for critical vulnerabilities (frontend)
        if: steps.check_dockerfile.outputs.exists == 'true' && matrix.project == 'frontend'
        id: check-docker-frontend
        continue-on-error: true
        run: |
          if ! command -v trivy &> /dev/null; then
            wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
            echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
            sudo apt-get update
            sudo apt-get install -y trivy
          fi
          
          CRITICAL_COUNT=$(trivy image --severity CRITICAL --format json ${{ matrix.project }}:scan 2>/dev/null | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' || echo "0")
          
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "has-critical=true" >> $GITHUB_OUTPUT
          else
            echo "has-critical=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for critical vulnerabilities (backend)
        if: steps.check_dockerfile.outputs.exists == 'true' && matrix.project == 'backend'
        id: check-docker-backend
        continue-on-error: true
        run: |
          if ! command -v trivy &> /dev/null; then
            wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
            echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
            sudo apt-get update
            sudo apt-get install -y trivy
          fi
          
          CRITICAL_COUNT=$(trivy image --severity CRITICAL --format json ${{ matrix.project }}:scan 2>/dev/null | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' || echo "0")
          
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "has-critical=true" >> $GITHUB_OUTPUT
          else
            echo "has-critical=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Docker scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-scan-${{ matrix.project }}
          path: security/reports/
          retention-days: 30
          if-no-files-found: warn

  # ============================================
  # JOB 5: Rapport et notifications
  # ============================================
  security-report:
    name: Rapport et notifications
    runs-on: ubuntu-latest
    needs: [dependency-scan, secret-scan, docker-scan, sast-scan]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download all scan reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: security/reports/

      - name: Determine severity
        id: severity
        run: |
          DEP_STATUS="${{ needs.dependency-scan.result }}"
          SECRET_STATUS="${{ needs.secret-scan.result }}"
          DOCKER_STATUS="${{ needs.docker-scan.result }}"
          SAST_STATUS="${{ needs.sast-scan.result }}"
          
          HAS_CRITICAL_DEP_FE="${{ needs.dependency-scan.outputs.has-critical-frontend }}"
          HAS_CRITICAL_DEP_BE="${{ needs.dependency-scan.outputs.has-critical-backend }}"
          HAS_CRITICAL_DOCKER_FE="${{ needs.docker-scan.outputs.has-critical-frontend }}"
          HAS_CRITICAL_DOCKER_BE="${{ needs.docker-scan.outputs.has-critical-backend }}"
          HAS_SECRETS="${{ needs.secret-scan.outputs.secrets-found }}"
          
          if [[ "$HAS_CRITICAL_DEP_FE" == "true" ]] || \
             [[ "$HAS_CRITICAL_DEP_BE" == "true" ]] || \
             [[ "$HAS_CRITICAL_DOCKER_FE" == "true" ]] || \
             [[ "$HAS_CRITICAL_DOCKER_BE" == "true" ]] || \
             [[ "$HAS_SECRETS" == "true" ]]; then
            echo "level=critical" >> $GITHUB_OUTPUT
            echo "🚨 CRITICAL issues detected"
          elif [[ "$DEP_STATUS" == "failure" ]] || \
               [[ "$DOCKER_STATUS" == "failure" ]] || \
               [[ "$SAST_STATUS" == "failure" ]]; then
            echo "level=warning" >> $GITHUB_OUTPUT
            echo "⚠️ WARNING level issues detected"
          else
            echo "level=success" >> $GITHUB_OUTPUT
            echo "✅ All checks passed"
          fi

      - name: Generate summary
        id: summary
        run: |
          mkdir -p security/reports

          HAS_CRITICAL_DEP_FE="${{ needs.dependency-scan.outputs.has-critical-frontend }}"
          HAS_CRITICAL_DEP_BE="${{ needs.dependency-scan.outputs.has-critical-backend }}"
          HAS_CRITICAL_DOCKER_FE="${{ needs.docker-scan.outputs.has-critical-frontend }}"
          HAS_CRITICAL_DOCKER_BE="${{ needs.docker-scan.outputs.has-critical-backend }}"
          HAS_SECRETS="${{ needs.secret-scan.outputs.secrets-found }}"

          # Déterminer emoji et statut par type de scan
          if [[ "$HAS_CRITICAL_DEP_FE" == "true" ]] || [[ "$HAS_CRITICAL_DEP_BE" == "true" ]]; then
            DEP_EMOJI="⚠️"; DEP_STATUS="failure"
          else
            DEP_EMOJI="✅"; DEP_STATUS="success"
          fi

          if [[ "$HAS_CRITICAL_DOCKER_FE" == "true" ]] || [[ "$HAS_CRITICAL_DOCKER_BE" == "true" ]]; then
            DOCKER_EMOJI="⚠️"; DOCKER_STATUS="failure"
          else
            DOCKER_EMOJI="✅"; DOCKER_STATUS="success"
          fi

          if [[ "$HAS_SECRETS" == "true" ]]; then
            SECRET_EMOJI="⚠️"; SECRET_STATUS="failure"
          else
            SECRET_EMOJI="✅"; SECRET_STATUS="success"
          fi

          # SAST
          SAST_STATUS="${{ needs.sast-scan.result }}"
          if [[ "$SAST_STATUS" == "success" ]]; then SAST_EMOJI="✅"; elif [[ "$SAST_STATUS" == "skipped" ]]; then SAST_EMOJI="⏭️"; else SAST_EMOJI="⚠️"; fi

          # Générer le Markdown
          cat > security/reports/summary.md << EOF
          # 🔒 Rapport de Sécurité
          
          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")  
          **Branch:** \`${{ github.ref_name }}\`  
          **Commit:** [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})  
          **Auteur:** @${{ github.actor }}
          
          ## 📊 Résultats des Scans
          
          | Type de Scan | Frontend | Backend | Statut Global |
          |--------------|----------|---------|---------------|
          | 📦 Dépendances | $DEP_EMOJI | $DEP_EMOJI | $DEP_STATUS |
          | 🔍 SAST (Code) | $SAST_EMOJI | $SAST_EMOJI | $SAST_STATUS |
          | 🐳 Docker | $DOCKER_EMOJI | $DOCKER_EMOJI | $DOCKER_STATUS |
          | 🔑 Secrets | - | - | $SECRET_EMOJI $SECRET_STATUS |
          
          ## 🎯 Niveau de sévérité : **${{ steps.severity.outputs.level }}**
          
          EOF
          
          if [ "${{ steps.severity.outputs.level }}" == "critical" ]; then
            cat >> security/reports/summary.md << EOF
          ## ⚠️ Actions Requises
          
          - 🚨 Des vulnérabilités CRITIQUES ont été détectées
          - 📧 Une notification email a été envoyée
          - 🔒 Correction URGENTE requise avant merge
          
          EOF
          fi
          
          cat >> security/reports/summary.md << EOF
          ---
          
          **[📊 Voir les détails complets](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})**
          **[🔒 GitHub Security](${{ github.server_url }}/${{ github.repository }}/security)**
          EOF
          
          cat security/reports/summary.md

      # ============================================
      # NOTIFICATIONS DISCORD
      # ============================================
      - name: Send Discord notification (Warning)
        if: steps.severity.outputs.level == 'warning' && env.DISCORD_WEBHOOK != ''
        continue-on-error: true
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "embeds": [{
                "title": "⚠️ Security Scan - Problèmes Mineurs",
                "description": "Des problèmes de sécurité mineurs ont été détectés",
                "color": 16753920,
                "fields": [
                  {
                    "name": "Branch",
                    "value": "'"${{ github.ref_name }}"'",
                    "inline": true
                  },
                  {
                    "name": "Commit",
                    "value": "'"${GITHUB_SHA:0:7}"'",
                    "inline": true
                  },
                  {
                    "name": "Action",
                    "value": "Vérifier les rapports",
                    "inline": true
                  }
                ],
                "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
              }]
            }' \
            "${{ env.DISCORD_WEBHOOK }}"

      - name: Send Discord notification (Critical)
        if: steps.severity.outputs.level == 'critical' && env.DISCORD_WEBHOOK != ''
        continue-on-error: true
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "content": "@here",
              "embeds": [{
                "title": "🚨 ALERTE CRITIQUE - Vulnérabilités Détectées",
                "description": "**Des vulnérabilités CRITIQUES ont été détectées !**\n\nAction immédiate requise.",
                "color": 16711680,
                "fields": [
                  {
                    "name": "Branch",
                    "value": "'"${{ github.ref_name }}"'",
                    "inline": true
                  },
                  {
                    "name": "Commit",
                    "value": "'"${GITHUB_SHA:0:7}"'",
                    "inline": true
                  },
                  {
                    "name": "⚠️ Priorité",
                    "value": "**URGENT**",
                    "inline": true
                  }
                ],
                "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
              }]
            }' \
            "${{ env.DISCORD_WEBHOOK }}"

      # ============================================
      # NOTIFICATION EMAIL (HOSTINGER)
      # ============================================
      - name: Send email notification (Critical)
        if: steps.severity.outputs.level == 'critical' && env.MAIL_SERVER != ''
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.MAIL_SERVER }}
          server_port: ${{ env.MAIL_PORT }}
          username: ${{ env.MAIL_USERNAME }}
          password: ${{ env.MAIL_PASSWORD }}
          subject: '🚨 CRITIQUE: Vulnérabilités de sécurité - ${{ github.repository }}'
          to: ${{ env.SECURITY_EMAIL }}
          from: ${{ env.MAIL_USERNAME }}
          content_type: text/html
          body: |
            <!DOCTYPE html>
            <html>
            <head>
              <style>
                body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
                .header { background-color: #dc3545; color: white; padding: 20px; text-align: center; }
                .content { padding: 20px; }
                .info { background-color: #f8f9fa; border-left: 4px solid #dc3545; padding: 15px; margin: 20px 0; }
                .button { background-color: #dc3545; color: white; padding: 10px 20px; text-decoration: none; display: inline-block; margin: 10px 0; border-radius: 5px; }
                .footer { background-color: #f8f9fa; padding: 15px; text-align: center; margin-top: 30px; font-size: 12px; color: #666; }
              </style>
            </head>
            <body>
              <div class="header">
                <h1>🚨 Alerte de Sécurité Critique</h1>
              </div>
              <div class="content">
                <p><strong>Des vulnérabilités critiques ont été détectées dans votre dépôt.</strong></p>
                
                <div class="info">
                  <p><strong>Repository:</strong> ${{ github.repository }}</p>
                  <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
                  <p><strong>Commit:</strong> ${{ github.sha }}</p>
                  <p><strong>Auteur:</strong> ${{ github.actor }}</p>
                  <p><strong>Date:</strong> $(date -u +"%Y-%m-%d %H:%M:%S UTC")</p>
                </div>
                
                <h3>⚠️ Action Requise</h3>
                <p>Une action immédiate est nécessaire pour corriger ces vulnérabilités avant tout déploiement en production.</p>
                
                <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" class="button">
                  Voir le rapport détaillé
                </a>
                
                <h3>📋 Prochaines étapes</h3>
                <ol>
                  <li>Consultez le rapport complet sur GitHub Actions</li>
                  <li>Identifiez les vulnérabilités critiques</li>
                  <li>Appliquez les correctifs recommandés</li>
                  <li>Relancez le scan de sécurité</li>
                </ol>
              </div>
              <div class="footer">
                <p>Ce message a été généré automatiquement par le système de scan de sécurité.</p>
                <p>GitHub Actions - Security Scanner</p>
              </div>
            </body>
            </html>

      # ============================================
      # AUTRES ACTIONS
      # ============================================
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ env.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            try {
              const summary = fs.readFileSync('security/reports/summary.md', 'utf8');
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            } catch (error) {
              console.log('Could not post comment:', error.message);
            }

      - name: Upload consolidated report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report-final
          path: security/reports/
          retention-days: 90
          if-no-files-found: warn

      - name: Job Summary
        if: always()
        run: |
          if [ -f security/reports/summary.md ]; then
            cat security/reports/summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "# 🔒 Security Scan Completed" >> $GITHUB_STEP_SUMMARY
            echo "Check the artifacts for detailed reports." >> $GITHUB_STEP_SUMMARY
          fi