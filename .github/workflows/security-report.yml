name: Security Report

on:
  workflow_call:
    inputs:
      dependency-scan-result:
        required: true
        type: string
      secret-scan-result:
        required: true
        type: string
      sast-scan-result:
        required: true
        type: string
      docker-scan-result:
        required: true
        type: string
      has-critical-dep-frontend:
        required: true
        type: string
      has-critical-dep-backend:
        required: true
        type: string
      has-critical-docker-frontend:
        required: true
        type: string
      has-critical-docker-backend:
        required: true
        type: string
      secrets-found:
        required: true
        type: string
    secrets:
      DISCORD_WEBHOOK:
        required: false
      MAIL_SERVER:
        required: false
      MAIL_PORT:
        required: false
      MAIL_USERNAME:
        required: false
      MAIL_PASSWORD:
        required: false
      SECURITY_EMAIL:
        required: false

jobs:
  security-report:
    name: Rapport et notifications
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download all scan reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: security/reports/

      - name: Determine severity
        id: severity
        run: |
          DEP_STATUS="${{ inputs.dependency-scan-result }}"
          SECRET_STATUS="${{ inputs.secret-scan-result }}"
          DOCKER_STATUS="${{ inputs.docker-scan-result }}"
          SAST_STATUS="${{ inputs.sast-scan-result }}"
          
          HAS_CRITICAL_DEP_FE="${{ inputs.has-critical-dep-frontend }}"
          HAS_CRITICAL_DEP_BE="${{ inputs.has-critical-dep-backend }}"
          HAS_CRITICAL_DOCKER_FE="${{ inputs.has-critical-docker-frontend }}"
          HAS_CRITICAL_DOCKER_BE="${{ inputs.has-critical-docker-backend }}"
          HAS_SECRETS="${{ inputs.secrets-found }}"
          
          if [[ "$HAS_CRITICAL_DEP_FE" == "true" ]] || \
             [[ "$HAS_CRITICAL_DEP_BE" == "true" ]] || \
             [[ "$HAS_CRITICAL_DOCKER_FE" == "true" ]] || \
             [[ "$HAS_CRITICAL_DOCKER_BE" == "true" ]] || \
             [[ "$HAS_SECRETS" == "true" ]]; then
            echo "level=critical" >> $GITHUB_OUTPUT
            echo "🚨 CRITICAL issues detected"
          elif [[ "$DEP_STATUS" == "failure" ]] || \
               [[ "$DOCKER_STATUS" == "failure" ]] || \
               [[ "$SAST_STATUS" == "failure" ]]; then
            echo "level=warning" >> $GITHUB_OUTPUT
            echo "⚠️ WARNING level issues detected"
          else
            echo "level=success" >> $GITHUB_OUTPUT
            echo "✅ All checks passed"
          fi

      - name: Generate summary with critical vulnerability details
        id: summary
        run: |
          mkdir -p security/reports

          HAS_CRITICAL_DEP_FE="${{ inputs.has-critical-dep-frontend }}"
          HAS_CRITICAL_DEP_BE="${{ inputs.has-critical-dep-backend }}"
          HAS_CRITICAL_DOCKER_FE="${{ inputs.has-critical-docker-frontend }}"
          HAS_CRITICAL_DOCKER_BE="${{ inputs.has-critical-docker-backend }}"
          HAS_SECRETS="${{ inputs.secrets-found }}"

          # Déterminer emoji et statut par type de scan
          if [[ "$HAS_CRITICAL_DEP_FE" == "true" ]] || [[ "$HAS_CRITICAL_DEP_BE" == "true" ]]; then
            DEP_EMOJI="⚠️"; DEP_STATUS="failure"
          else
            DEP_EMOJI="✅"; DEP_STATUS="success"
          fi

          if [[ "$HAS_CRITICAL_DOCKER_FE" == "true" ]] || [[ "$HAS_CRITICAL_DOCKER_BE" == "true" ]]; then
            DOCKER_EMOJI="⚠️"; DOCKER_STATUS="failure"
          else
            DOCKER_EMOJI="✅"; DOCKER_STATUS="success"
          fi

          if [[ "$HAS_SECRETS" == "true" ]]; then
            SECRET_EMOJI="⚠️"; SECRET_STATUS="failure"
          else
            SECRET_EMOJI="✅"; SECRET_STATUS="success"
          fi

          # SAST
          SAST_STATUS="${{ inputs.sast-scan-result }}"
          if [[ "$SAST_STATUS" == "success" ]]; then SAST_EMOJI="✅"; elif [[ "$SAST_STATUS" == "skipped" ]]; then SAST_EMOJI="⏭️"; else SAST_EMOJI="⚠️"; fi

          # Générer le Markdown initial
          cat > security/reports/summary.md << EOF
          # 🔒 Rapport de Sécurité

          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")  
          **Branch:** \`${{ github.ref_name }}\`  
          **Commit:** [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})  
          **Auteur:** @${{ github.actor }}

          ## 📊 Résultats des Scans

          | Type de Scan | Frontend | Backend | Statut Global |
          |--------------|----------|---------|---------------|
          | 📦 Dépendances | $DEP_EMOJI | $DEP_EMOJI | $DEP_STATUS |
          | 🔍 SAST (Code) | $SAST_EMOJI | $SAST_EMOJI | $SAST_STATUS |
          | 🐳 Docker | $DOCKER_EMOJI | $DOCKER_EMOJI | $DOCKER_STATUS |
          | 🔑 Secrets | - | - | $SECRET_EMOJI $SECRET_STATUS |

          ## 🎯 Niveau de sévérité : **${{ steps.severity.outputs.level }}**

          EOF

          if [ "${{ steps.severity.outputs.level }}" == "critical" ]; then
            cat >> security/reports/summary.md << EOF
          ## ⚠️ Actions Requises

          - 🚨 Des vulnérabilités CRITIQUES ont été détectées
          - 📧 Une notification email a été envoyée
          - 🔒 Correction URGENTE requise avant merge

          EOF
          fi

          echo "## 📝 Détail des vulnérabilités CRITIQUES détectées" >> security/reports/summary.md
          echo "" >> security/reports/summary.md

          FOUND_CRITICAL="false"

          print_table_header() {
            echo "| Package/Image | Version | CVE | Sévérité | Emplacement |" >> security/reports/summary.md
            echo "|--------------|---------|-----|----------|-------------|" >> security/reports/summary.md
          }

          # === 1. NPM AUDIT JSON FILES ===
          for JSON in security/reports/npm-audit-frontend.json security/reports/npm-audit-backend.json; do
            if [ -f "$JSON" ]; then
              CRIT_COUNT=$(jq '[.advisories[]] | length' "$JSON" 2>/dev/null || echo "0")
              if [ "$CRIT_COUNT" != "0" ] && [ "$CRIT_COUNT" -gt 0 ]; then
                FOUND_CRITICAL="true"
                echo "### 📦 Dépendances ($(basename "$JSON"))" >> security/reports/summary.md
                print_table_header
                jq -r '.advisories[] | 
                  [ .module_name, .findings[0].version, (.cves[0] // .url // "N/A"), .severity, .findings[0].paths[0] ] | 
                  @tsv' "$JSON" | \
                  while IFS=$'\t' read -r pkg ver cve sev loc; do
                    echo "| $pkg | $ver | $cve | $sev | $loc |" >> security/reports/summary.md
                  done
                echo "" >> security/reports/summary.md
              fi
            fi
          done

          # === 2. TRIVY JSON FILES ===
          for JSON in security/reports/docker-scan-frontend/trivy-frontend.json security/reports/docker-scan-backend/trivy-backend.json; do
            if [ -f "$JSON" ]; then
              CRIT_COUNT=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$JSON" 2>/dev/null || echo "0")
              
              if [ "$CRIT_COUNT" != "0" ] && [ "$CRIT_COUNT" -gt 0 ]; then
                FOUND_CRITICAL="true"
                SERVICE_NAME=$(basename "$(dirname "$JSON")" | sed 's/docker-scan-//')
                
                echo "### 🐳 Trivy - $SERVICE_NAME" >> security/reports/summary.md
                print_table_header
                
                jq -r '
                  .Results[]? 
                  | .Vulnerabilities[]? 
                  | [
                      .PkgName // "N/A",
                      .InstalledVersion // "N/A",
                      .VulnerabilityID // "N/A",
                      .Severity // "N/A",
                      (.PrimaryURL // "N/A")
                    ] 
                  | @tsv
                ' "$JSON" 2>/dev/null | \
                while IFS=$'\t' read -r pkg ver cve sev url; do
                  if [ "$url" != "N/A" ]; then
                    url_link="[$cve]($url)"
                  else
                    url_link="$cve"
                  fi
                  echo "| $pkg | $ver | $cve | $sev | $url |" >> security/reports/summary.md
                done
                
                echo "" >> security/reports/summary.md
              fi
            fi
          done

          if [ "$FOUND_CRITICAL" != "true" ]; then
            echo "_Aucune vulnérabilité critique détectée dans les rapports._" >> security/reports/summary.md
          fi

          echo "" >> security/reports/summary.md
          echo "---" >> security/reports/summary.md
          echo "" >> security/reports/summary.md
          echo "**[📊 Voir les détails complets](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})**" >> security/reports/summary.md
          echo "**[🔒 GitHub Security](${{ github.server_url }}/${{ github.repository }}/security)**" >> security/reports/summary.md

          cat security/reports/summary.md

      - name: Check for DISCORD_WEBHOOK secret
        id: check-discord
        run: |
          if [ "${{ secrets.DISCORD_WEBHOOK }}" != "" ]; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for MAIL_SERVER secret
        id: check-mail
        run: |
          if [ "${{ secrets.MAIL_SERVER }}" != "" ]; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
          fi

      - name: Send Discord notification (Warning)
        if: steps.severity.outputs.level == 'warning' && steps.check-discord.outputs.present == 'true'
        continue-on-error: true
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "embeds": [{
                "title": "⚠️ Security Scan - Problèmes Mineurs",
                "description": "Des problèmes de sécurité mineurs ont été détectés",
                "color": 16753920,
                "fields": [
                  {
                    "name": "Branch",
                    "value": "'"${{ github.ref_name }}"'",
                    "inline": true
                  },
                  {
                    "name": "Commit",
                    "value": "'"${GITHUB_SHA:0:7}"'",
                    "inline": true
                  },
                  {
                    "name": "Action",
                    "value": "Vérifier les rapports",
                    "inline": true
                  }
                ],
                "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
              }]
            }' \
            "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Send Discord notification (Critical)
        if: steps.severity.outputs.level == 'critical' && steps.check-discord.outputs.present == 'true'
        continue-on-error: true
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "content": "@here",
              "embeds": [{
                "title": "🚨 ALERTE CRITIQUE - Vulnérabilités Détectées",
                "description": "**Des vulnérabilités CRITIQUES ont été détectées !**\n\nAction immédiate requise.",
                "color": 16711680,
                "fields": [
                  {
                    "name": "Branch",
                    "value": "'"${{ github.ref_name }}"'",
                    "inline": true
                  },
                  {
                    "name": "Commit",
                    "value": "'"${GITHUB_SHA:0:7}"'",
                    "inline": true
                  },
                  {
                    "name": "⚠️ Priorité",
                    "value": "**URGENT**",
                    "inline": true
                  }
                ],
                "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
              }]
            }' \
            "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Send email notification (Critical)
        if: steps.severity.outputs.level == 'critical' && steps.check-mail.outputs.present == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: '🚨 CRITIQUE: Vulnérabilités de sécurité - ${{ github.repository }}'
          to: ${{ secrets.SECURITY_EMAIL }}
          from: ${{ secrets.MAIL_USERNAME }}
          html_body: |
            <!DOCTYPE html>
            <html>
            <head>
              <style>
                body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
                .header { background-color: #dc3545; color: white; padding: 20px; text-align: center; }
                .content { padding: 20px; }
                .info { background-color: #f8f9fa; border-left: 4px solid #dc3545; padding: 15px; margin: 20px 0; }
                .button { background-color: #dc3545; color: white; padding: 10px 20px; text-decoration: none; display: inline-block; margin: 10px 0; border-radius: 5px; }
                .footer { background-color: #f8f9fa; padding: 15px; text-align: center; margin-top: 30px; font-size: 12px; color: #666; }
              </style>
            </head>
            <body>
              <div class="header">
                <h1>🚨 Alerte de Sécurité Critique</h1>
              </div>
              <div class="content">
                <p><strong>Des vulnérabilités critiques ont été détectées dans votre dépôt.</strong></p>
                
                <div class="info">
                  <p><strong>Repository:</strong> ${{ github.repository }}</p>
                  <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
                  <p><strong>Commit:</strong> ${{ github.sha }}</p>
                  <p><strong>Auteur:</strong> ${{ github.actor }}</p>
                  <p><strong>Date:</strong> $(date -u +"%Y-%m-%d %H:%M:%S UTC")</p>
                </div>
                
                <h3>⚠️ Action Requise</h3>
                <p>Une action immédiate est nécessaire pour corriger ces vulnérabilités avant tout déploiement en production.</p>
                
                <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" class="button">
                  Voir le rapport détaillé
                </a>
                
                <h3>📋 Prochaines étapes</h3>
                <ol>
                  <li>Consultez le rapport complet sur GitHub Actions</li>
                  <li>Identifiez les vulnérabilités critiques</li>
                  <li>Appliquez les correctifs recommandés</li>
                  <li>Relancez le scan de sécurité</li>
                </ol>
              </div>
              <div class="footer">
                <p>Ce message a été généré automatiquement par le système de scan de sécurité.</p>
                <p>GitHub Actions - Security Scanner</p>
              </div>
            </body>
            </html>

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            try {
              const summary = fs.readFileSync('security/reports/summary.md', 'utf8');
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            } catch (error) {
              console.log('Could not post comment:', error.message);
            }

      - name: Upload consolidated report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report-final
          path: security/reports/
          retention-days: 90
          if-no-files-found: warn

      - name: Job Summary
        if: always()
        run: |
          if [ -f security/reports/summary.md ]; then
            cat security/reports/summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "# 🔒 Security Scan Completed" >> $GITHUB_STEP_SUMMARY
            echo "Check the artifacts for detailed reports." >> $GITHUB_STEP_SUMMARY
          fi