name: Secret Scan

on:
  workflow_call:
    outputs:
      secrets-found:
        description: "Secrets were found"
        value: ${{ jobs.secret-scan.outputs.secrets-found }}

jobs:
  secret-scan:
    name: Détection de secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    outputs:
      secrets-found: ${{ steps.check-secrets.outputs.found }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run TruffleHog scan
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Check secrets result
        id: check-secrets
        run: |
          if [ "${{ steps.trufflehog.outcome }}" == "failure" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi
