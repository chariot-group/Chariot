name: Dependency Scan

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '20'
    outputs:
      has-critical-web:
        description: "Web has critical vulnerabilities"
        value: ${{ jobs.dependency-scan-web.outputs.has-critical-web }}
      has-critical-backend:
        description: "Backend has critical vulnerabilities"
        value: ${{ jobs.dependency-scan-backend.outputs.has-critical-backend }}

jobs:
  dependency-scan-web:
    name: Scan des dépendances
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    outputs:
      has-critical-web: ${{ steps.check-vuln-web.outputs.has-critical }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js for web
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: services/web/client/package-lock.json

      - name: Install dependencies for project
        run: |
          cd services/web/client
          npm ci

      - name: Create reports directory
        run: mkdir -p security/reports

      - name: Run Trivy dependency scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: './services/web/client'
          format: 'json'
          output: ${{ github.workspace }}/security/reports/trivy-deps-web.json
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Check for critical vulnerabilities
        id: check-vuln-web
        working-directory: ./security/reports
        continue-on-error: true
        run: |
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-deps-web.json 2>/dev/null || echo "0")
          if [ "$CRITICAL" -gt 0 ]; then
            echo "has-critical=true" >> $GITHUB_OUTPUT
          else
            echo "has-critical=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload dependency scan reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-scan-web
          path: security/reports/
          retention-days: 30
          if-no-files-found: warn
  
  dependency-scan-backend:
    name: Scan des dépendances
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    outputs:
      has-critical-backend: ${{ steps.check-vuln-backend.outputs.has-critical }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js for adventure
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: services/adventure/api/package-lock.json

      - name: Install dependencies for project
        run: |
          cd services/adventure/api
          npm ci

      - name: Create reports directory
        run: mkdir -p security/reports

      - name: Run Trivy dependency scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: './services/adventure/api'
          format: 'json'
          output: ${{ github.workspace }}/security/reports/trivy-deps-backend.json
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Check for critical vulnerabilities
        id: check-vuln-backend
        working-directory: ./security/reports
        continue-on-error: true
        run: |
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-deps-backend.json 2>/dev/null || echo "0")
          if [ "$CRITICAL" -gt 0 ]; then
            echo "has-critical=true" >> $GITHUB_OUTPUT
          else
            echo "has-critical=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload dependency scan reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-scan-adventure
          path: security/reports/
          retention-days: 30
          if-no-files-found: warn
