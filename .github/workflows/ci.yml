name: CI - Frontend & Backend

on:
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: [frontend, backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js for ${{ matrix.project }}
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check for ${{ matrix.project }}
        working-directory: ./services/chariot/${{ matrix.project }}
        run: pnpm run format

      - name: Run unit tests for ${{ matrix.project }}
        working-directory: ./services/chariot/${{ matrix.project }}
        if: matrix.project == 'backend'
        run: pnpm test

      - name: Build ${{ matrix.project }}
        working-directory: ./services/chariot/${{ matrix.project }}
        run: pnpm run build