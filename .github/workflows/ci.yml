        with:
          context: ./services/payment/api
          file: ./services/payment/api/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/chariot-payment-${{ steps.env.outputs.env_name }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/chariot-payment-${{ steps.env.outputs.env_name }}:${{ github.sha }}
          platforms: linux/amd64
          build-args: |
            NODE_ENV=production
            DATABASE_URL=postgresql://fake:fake@localhost:5432/fake
      - name: Output image tags
        run: |
          echo "Pushed: ${{ env.REGISTRY }}/${{ env.OWNER }}/chariot-payment-${{ steps.env.outputs.env_name }}:latest"
          echo "Pushed: ${{ env.REGISTRY }}/${{ env.OWNER }}/chariot-payment-${{ steps.env.outputs.env_name }}:${{ github.sha }}"

