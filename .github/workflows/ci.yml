name: CI - Frontend & Backend

on:
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: [frontend, backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js for ${{ matrix.project }}
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies for project
        run: |
          cd services/chariot/${{ matrix.project }}
          npm ci

      - name: Format check for ${{ matrix.project }}
        working-directory: ./services/chariot/${{ matrix.project }}
        run: npm run format

      - name: Run unit tests for ${{ matrix.project }}
        working-directory: ./services/chariot/${{ matrix.project }}
        if: matrix.project == 'backend'
        run: npm test

      - name: Build ${{ matrix.project }}
        working-directory: ./services/chariot/${{ matrix.project }}
        run: npm run build