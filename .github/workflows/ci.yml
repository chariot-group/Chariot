name: CI/CD - Build, Test & Deploy

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - integ
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'integration'
        type: choice
        options:
          - integration
          - production

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  # Job CI pour le frontend web
  ci-web:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js for web
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/web/client/package-lock.json

      - name: Install dependencies for web
        run: |
          cd services/web/client
          npm ci

      - name: Run lint for web
        working-directory: ./services/web/client
        run: npm run lint

      - name: Format check for web
        working-directory: ./services/web/client
        run: npm run format

      - name: Build web
        working-directory: ./services/web/client
        run: npm run build

  # Job CI pour le backend adventure
  ci-adventure:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js for adventure
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/adventure/api/package-lock.json

      - name: Install dependencies for adventure
        run: |
          cd services/adventure/api
          npm ci

      - name: Run lint for adventure
        working-directory: ./services/adventure/api
        run: npm run lint

      - name: Format check for adventure
        working-directory: ./services/adventure/api
        run: npm run format

      - name: Run unit tests for adventure
        working-directory: ./services/adventure/api
        run: npm test

      - name: Build adventure
        working-directory: ./services/adventure/api
        run: npm run build

  # Job CI pour la gateway
  ci-gateway:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js for gateway
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/gateway/api/package-lock.json

      - name: Install dependencies for gateway
        run: |
          cd services/gateway/api
          npm ci

      - name: Run lint for gateway
        working-directory: ./services/gateway/api
        run: npm run lint

      - name: Format check for gateway
        working-directory: ./services/gateway/api
        run: npm run format

      - name: Run unit tests for gateway
        working-directory: ./services/gateway/api
        run: npm test

      - name: Build gateway
        working-directory: ./services/gateway/api
        run: npm run build

  # Job CI pour le service payment
  ci-payment:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js for payment
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/payment/api/package-lock.json

      - name: Install dependencies for payment
        run: |
          cd services/payment/api
          npm ci

      - name: Run lint for payment
        working-directory: ./services/payment/api
        run: npm run lint

      - name: Format check for payment
        working-directory: ./services/payment/api
        run: npm run format

      - name: Run unit tests for payment
        working-directory: ./services/payment/api
        run: npm test

      - name: Build payment
        working-directory: ./services/payment/api
        run: npm run build

  # Job CI pour le service admin
  ci-admin:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js for admin
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/admin/client/package-lock.json

      - name: Install dependencies for admin
        run: |
          cd services/admin/client
          npm ci

      - name: Run lint for admin
        working-directory: ./services/admin/client
        run: npm run lint

      - name: Build admin
        working-directory: ./services/admin/client
        run: npm run build

  # Job CD pour déployer le frontend (sur push main/integ ou workflow_dispatch)
  deploy-web:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/integ' || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine environment and set variables
        id: env
        run: |
          # Détermine l'environnement basé sur la branche (push) ou l'input (workflow_dispatch)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV_NAME="${{ github.event.inputs.environment }}"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            ENV_NAME="production"
          else
            ENV_NAME="integration"
          fi
          
          echo "env_name=${ENV_NAME}" >> $GITHUB_OUTPUT
          
          if [[ "${ENV_NAME}" == "production" ]]; then
            echo "api_url=${{ secrets.PROD_API_URL }}" >> $GITHUB_OUTPUT
            echo "keycloak_url=${{ secrets.PROD_KEYCLOAK_URL }}" >> $GITHUB_OUTPUT
            echo "session_ws_url=${{ secrets.PROD_SESSION_WS_URL }}" >> $GITHUB_OUTPUT
            echo "codex_url=${{ secrets.PROD_CODEX_URL }}" >> $GITHUB_OUTPUT
            echo "stripe_publishable_key=${{ secrets.PROD_STRIPE_PUBLISHABLE_KEY }}" >> $GITHUB_OUTPUT
            echo "env_name=${ENV_NAME}" >> $GITHUB_OUTPUT
          else
            echo "api_url=${{ secrets.INTEG_API_URL }}" >> $GITHUB_OUTPUT
            echo "keycloak_url=${{ secrets.INTEG_KEYCLOAK_URL }}" >> $GITHUB_OUTPUT
            echo "session_ws_url=${{ secrets.INTEG_SESSION_WS_URL }}" >> $GITHUB_OUTPUT
            echo "codex_url=${{ secrets.INTEG_CODEX_URL }}" >> $GITHUB_OUTPUT
            echo "stripe_publishable_key=${{ secrets.INTEG_STRIPE_PUBLISHABLE_KEY }}" >> $GITHUB_OUTPUT
            echo "env_name=${ENV_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Chariot Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./services/web/client
          file: ./services/web/client/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/chariot-frontend-${{ steps.env.outputs.env_name }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/chariot-frontend-${{ steps.env.outputs.env_name }}:${{ github.sha }}
          platforms: linux/amd64
          build-args: |
            NODE_ENV=production
            NEXT_PUBLIC_API_URL=${{ steps.env.outputs.api_url }}
            NEXT_PUBLIC_KEYCLOAK_URL=${{ steps.env.outputs.keycloak_url }}
            NEXT_PUBLIC_CODEX_URL=${{ steps.env.outputs.codex_url }}
            NEXT_PUBLIC_KEYCLOAK_REALM=chariot
            NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=chariot-app
            NEXT_PUBLIC_ENV_NAME=${{ steps.env.outputs.env_name }}
            NEXT_PUBLIC_SESSION_WS_URL=${{ steps.env.outputs.session_ws_url }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ steps.env.outputs.stripe_publishable_key }}

      - name: Output image tags
        run: |
          echo "Pushed: ${{ env.REGISTRY }}/${{ env.OWNER }}/chariot-frontend-${{ steps.env.outputs.env_name }}:latest"
          echo "Pushed: ${{ env.REGISTRY }}/${{ env.OWNER }}/chariot-frontend-${{ steps.env.outputs.env_name }}:${{ github.sha }}"

  # Job CD pour déployer le service adventure (sur push main/integ ou workflow_dispatch)
  deploy-adventure:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/integ' || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine environment and set variables
        id: env
        run: |
          # Détermine l'environnement basé sur la branche (push) ou l'input (workflow_dispatch)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV_NAME="${{ github.event.inputs.environment }}"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            ENV_NAME="production"
          else
            ENV_NAME="integration"
          fi
          
          echo "env_name=${ENV_NAME}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Chariot Adventure
        uses: docker/build-push-action@v7
        with:
          context: ./services/adventure/api
          file: ./services/adventure/api/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/chariot-adventure-${{ steps.env.outputs.env_name }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/chariot-adventure-${{ steps.env.outputs.env_name }}:${{ github.sha }}
          platforms: linux/amd64
          build-args: |
            NODE_ENV=production
            NEXT_PUBLIC_ENV_NAME=${{ steps.env.outputs.env_name }}
      - name: Output image tags
        run: |
          echo "Pushed: ${{ env.REGISTRY }}/${{ env.OWNER }}/chariot-adventure-${{ steps.env.outputs.env_name }}:latest"
          echo "Pushed: ${{ env.REGISTRY }}/${{ env.OWNER }}/chariot-adventure-${{ steps.env.outputs.env_name }}:${{ github.sha }}"

  # Job CI pour le backend session
  ci-session:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js for session
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/session/api/package-lock.json

      - name: Install dependencies for session
        run: |
          cd services/session/api
          npm ci

      - name: Format check for session
        working-directory: ./services/session/api
        run: npm run format

      - name: Run unit tests for session
        working-directory: ./services/session/api
        run: npm test

      - name: Build session
        working-directory: ./services/session/api
        run: npm run build

  # Job CD pour déployer le service session (sur push main/integ ou workflow_dispatch)
  deploy-session:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/integ' || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine environment and set variables
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV_NAME="${{ github.event.inputs.environment }}"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            ENV_NAME="production"
          else
            ENV_NAME="integration"
          fi
          
          echo "env_name=${ENV_NAME}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Chariot Session
        uses: docker/build-push-action@v7
        with:
          context: ./services/session/api
          file: ./services/session/api/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/chariot-session-${{ steps.env.outputs.env_name }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/chariot-session-${{ steps.env.outputs.env_name }}:${{ github.sha }}
          platforms: linux/amd64
          build-args: |
            NODE_ENV=production
            NEXT_PUBLIC_ENV_NAME=${{ steps.env.outputs.env_name }}
            DATABASE_URL=postgresql://fake:fake@localhost:5432/fake
      - name: Output image tags
        run: |
          echo "Pushed: ${{ env.REGISTRY }}/${{ env.OWNER }}/chariot-session-${{ steps.env.outputs.env_name }}:latest"
          echo "Pushed: ${{ env.REGISTRY }}/${{ env.OWNER }}/chariot-session-${{ steps.env.outputs.env_name }}:${{ github.sha }}"

  # Job CD pour déployer la gateway (sur push main/integ ou workflow_dispatch)
  deploy-gateway:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/integ' || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine environment and set variables
        id: env
        run: |
          # Détermine l'environnement basé sur la branche (push) ou l'input (workflow_dispatch)
