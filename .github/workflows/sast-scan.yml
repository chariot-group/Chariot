name: SAST Scan

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '20'
    secrets:
      SONAR_TOKEN:
        required: true
      # GITHUB_TOKEN is provided by GitHub automatically and cannot be declared here

jobs:
  sast-scan:
    name: Analyse statique (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install backend dependencies
        run: |
          cd services/chariot/backend
          npm ci

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-cache-${{ runner.os }}-${{ hashFiles('**/sonar-project.properties') }}
          restore-keys: |
            sonar-cache-${{ runner.os }}-

      - name: Run backend tests with coverage
        working-directory: ./services/chariot/backend
        continue-on-error: true
        run: |
          if npm run test:cov 2>/dev/null; then
            echo "✅ Backend tests completed with coverage"
          else
            echo "⚠️ Backend tests skipped or failed"
          fi

      - name: Check for SONAR_TOKEN secret
        id: check-sonar
        run: |
          if [ "${{ secrets.SONAR_TOKEN }}" != "" ]; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
          fi

      - name: SonarCloud Scan (Monorepo)
        if: steps.check-sonar.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@v6
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
