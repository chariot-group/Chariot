    ignore:
      - dependency-name: "stripe"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @nestjs/swagger 12 requires Nest 12: migrate all services together
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]

  # npm — load-test
  - package-ecosystem: "npm"
