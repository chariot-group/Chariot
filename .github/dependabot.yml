version: 2

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 2 * * 0,6"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  # npm — adventure
  - package-ecosystem: "npm"
    directory: "/services/adventure/api"
    schedule:
      interval: "cron"
      cronjob: "0 2 * * 0,6"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      adventure-minor-and-patch:
        update-types: ["minor", "patch"]
      adventure-major:
        update-types: ["major"]
    ignore:
      # typescript-eslint peer is still <6.1.0; TS 7 breaks npm ci
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # nest-winston / nestjs-prometheus peers still stop at Nest 11
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]

  # npm — gateway
  - package-ecosystem: "npm"
    directory: "/services/gateway/api"
    schedule:
      interval: "cron"
      cronjob: "0 2 * * 0,6"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      gateway-minor-and-patch:
        update-types: ["minor", "patch"]
      gateway-major:
        update-types: ["major"]
    ignore:
      - dependency-name: "stripe"
      - dependency-name: "@stripe/*"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # nest-winston / nestjs-prometheus peers still stop at Nest 11
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]

  # npm — session
  - package-ecosystem: "npm"
    directory: "/services/session/api"
    schedule:
      interval: "cron"
      cronjob: "0 2 * * 0,6"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      session-minor-and-patch:
        update-types: ["minor", "patch"]
      session-major:
        update-types: ["major"]
    ignore:
      - dependency-name: "stripe"
      - dependency-name: "@stripe/*"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # nest-winston / nestjs-prometheus peers still stop at Nest 11
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]

  # npm — web
  - package-ecosystem: "npm"
    directory: "/services/web/client"
    schedule:
      interval: "cron"
      cronjob: "0 2 * * 0,6"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]
      web-major:
        update-types: ["major"]
    ignore:
      # typescript-eslint peer is still <6.1.0; TS 7 has no programmatic API
      # (crash: Cannot read properties of undefined (reading 'Cjs'))
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # npm — admin
  - package-ecosystem: "npm"
    directory: "/services/admin/client"
    schedule:
      interval: "cron"
      cronjob: "0 2 * * 0,6"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      admin-minor-and-patch:
        update-types: ["minor", "patch"]
      admin-major:
        update-types: ["major"]
    ignore:
      # typescript-eslint peer is still <6.1.0; TS 7 has no programmatic API
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # npm — media
  - package-ecosystem: "npm"
    directory: "/services/media/api"
    schedule:
      interval: "cron"
      cronjob: "0 2 * * 0,6"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      media-minor-and-patch:
        update-types: ["minor", "patch"]
      media-major:
        update-types: ["major"]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # nest-winston peers still stop at Nest 11
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]

  # npm — payment
  - package-ecosystem: "npm"
