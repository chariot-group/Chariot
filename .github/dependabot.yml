version: 2

multi-ecosystem-groups:
  weekend-nightly:
    schedule:
      interval: "cron"
      cronjob: "0 2 * * 0,6"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 1

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "weekend-nightly"
    patterns:
      - "*"

  # npm — adventure
  - package-ecosystem: "npm"
    directory: "/services/adventure/api"
    multi-ecosystem-group: "weekend-nightly"
    patterns:
      - "*"
    versioning-strategy: increase
    ignore:
      # typescript-eslint peer is still <6.1.0; TS 7 breaks npm ci
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # npm — gateway
  - package-ecosystem: "npm"
    directory: "/services/gateway/api"
    multi-ecosystem-group: "weekend-nightly"
    patterns:
      - "*"
    versioning-strategy: increase
    ignore:
      - dependency-name: "stripe"
      - dependency-name: "@stripe/*"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # npm — session
  - package-ecosystem: "npm"
    directory: "/services/session/api"
    multi-ecosystem-group: "weekend-nightly"
    patterns:
      - "*"
    versioning-strategy: increase
    ignore:
      - dependency-name: "stripe"
      - dependency-name: "@stripe/*"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # npm — web
  - package-ecosystem: "npm"
    directory: "/services/web/client"
    multi-ecosystem-group: "weekend-nightly"
    patterns:
      - "*"
    versioning-strategy: increase
    ignore:
      # typescript-eslint peer is still <6.1.0; TS 7 has no programmatic API
      # (crash: Cannot read properties of undefined (reading 'Cjs'))
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Docker — adventure
  - package-ecosystem: "docker"
    directory: "/services/adventure/api"
    multi-ecosystem-group: "weekend-nightly"
    patterns:
      - "*"

  # Docker — gateway
  - package-ecosystem: "docker"
    directory: "/services/gateway/api"
    multi-ecosystem-group: "weekend-nightly"
    patterns:
      - "*"

  # Docker — session
  - package-ecosystem: "docker"
    directory: "/services/session/api"
    multi-ecosystem-group: "weekend-nightly"
    patterns:
      - "*"

  # npm — media
  - package-ecosystem: "npm"
    directory: "/services/media/api"
    multi-ecosystem-group: "weekend-nightly"
    patterns:
      - "*"
    versioning-strategy: increase
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Docker — media
  - package-ecosystem: "docker"
    directory: "/services/media/api"
    multi-ecosystem-group: "weekend-nightly"
    patterns:
      - "*"

  # Docker — sso
  - package-ecosystem: "docker"
    directory: "/services/sso"
    multi-ecosystem-group: "weekend-nightly"
    patterns:
      - "*"

  # Docker — web
  - package-ecosystem: "docker"
    directory: "/services/web/client"
    multi-ecosystem-group: "weekend-nightly"
    patterns:
      - "*"
