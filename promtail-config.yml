# ============================================================================
# SERVER CONFIG - Configuration du serveur HTTP de Promtail
# ============================================================================
server:
  http_listen_port: 9080
  log_level: info

# ============================================================================
# CLIENTS CONFIG - Configuration des clients Loki
# ============================================================================
clients:
  - url: http://loki:3100/loki/api/v1/push

# ============================================================================
# POSITIONS CONFIG - Stockage de la position des fichiers lus
# ============================================================================
positions:
  filename: /tmp/promtail/positions.yaml

# ============================================================================
# SCRAPE CONFIGS - Configuration des sources de logs à collecter
# ============================================================================
scrape_configs:
  # =========================================================================
  # JOB 1: LOGS BACKEND (Winston - NestJS)
  # =========================================================================
  - job_name: backend-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: backend
          service: nestjs
          component: application
          __path__: /logs/backend/*.log
    
    pipeline_stages:
      # Parser les logs Winston (format: timestamp - level: [context] message)
      # Ex: 2024-10-24 14:30:45.123 PM - info: [AppService] User login successful
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3} [AP]M) - (?P<level>\w+): \[(?P<context>[\w\.]+)\] (?P<message>.*)$'
      
      # Parser les timestamps Winston
      - timestamp:
          format: '2006-01-02 15:04:05.000 PM'
          source: timestamp
      
      # Extraire le level et le context comme labels
      - labels:
          level:
          context:
      
      # Utiliser le message comme contenu du log
      - output:
          source: message

  # =========================================================================
  # JOB 2: LOGS FRONTEND (Next.js)
  # =========================================================================
  - job_name: frontend-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: frontend
          service: nextjs
          component: application
          __path__: /logs/frontend/*.log
    
    pipeline_stages:
      # Simple extraction du message (les logs Next.js sont moins structurés)
      - regex:
          expression: '(?P<message>.*)'
      
      - labels:
          service: nextjs
      
      - output:
          source: message

  # =========================================================================
  # JOB 3: LOGS MONGODB
  # =========================================================================
  - job_name: mongodb-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: mongodb
          service: database
          component: storage
          __path__: /logs/mongodb/*.log
    
    pipeline_stages:
      # Parser les logs MongoDB (format texte standard)
      - regex:
          expression: '(?P<message>.*)'
      
      - labels:
          service: database
      
      - output:
          source: message
